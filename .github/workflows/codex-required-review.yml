name: Codex Required Review

# Posts a `codex-review` GitHub status check on a PR's head commit so
# branch protection can require Codex to actually review before merge.
#
# Why this exists: chatgpt-codex-connector emits PR reviews but does NOT
# emit GitHub Actions check-runs or commit statuses. Branch protection's
# `required_status_checks.contexts` can only require a status check, not
# a PR review. Without this shim, "require Codex review" can't be
# enforced — see docs/audits/2026-05-04-codex-portfolio-audit.md.
#
# Codex has TWO observed response shapes (AHAD-15, 2026-05-05):
#   A. Formal PR review (auto-triggered on PR open). Fires the
#      pull_request_review event. Detected via the reviews API
#      with commit_id == head SHA.
#   B. Issue-comment reply to an `@codex review` mention. Does NOT
#      fire pull_request_review. Detected via issue_comment event on
#      the PR with author == chatgpt-codex-connector[bot] and a body
#      whose first content line starts with `Codex Review` (matches
#      both `Codex Review: Didn't find any major issues...` and
#      `### 💡 Codex Review` markdown shapes).
#
# Shape B was the bin#7 stall (AHAD-12, 77 min open with required check
# never posted) — Codex had reviewed via comment, but the shim only
# listened for shape A.
#
# Behavior:
#   - On PR open / synchronize / reopened: post `codex-review` as
#     `success` if a Codex formal review already exists for the head
#     SHA; otherwise post nothing (the missing required check is the
#     pending signal — branch protection treats it as blocking).
#   - On Codex submitting a formal review (pull_request_review event):
#     post `codex-review` as `success` for that head commit.
#   - On Codex commenting via @-mention (issue_comment event from
#     chatgpt-codex-connector[bot]): post `codex-review` as `success`
#     for the current head SHA, gated on TWO checks:
#       (1) Prefix guard — body's first content line matches
#           `Codex Review` (rejects refusals + non-review comments).
#       (2) Anti-stale-bypass — HEAD wasn't pushed between the
#           review request and the bot response. Composed of:
#           - Mention selection: the @codex mention this response
#             is for is the OLDEST unanswered one — earliest
#             non-bot @codex comment after the last bot
#             Codex-Review-shape comment (Codex P1 #3, AHAD-15
#             own-PR review). Latest-mention heuristics let an
#             attacker decoy a stale response onto a new SHA.
#           - Push timestamp: from `actions/runs` filtered to
#             `event=pull_request_target`, which is server-side
#             and ungameable. `commit.committer.date` lives on
#             the commit object and `git commit --date=…` would
#             defeat that gate (Codex P1 #2).
#           - Comparison: STRICT `<` so equal-second push/mention
#             pairs (same UTC second) are rejected as
#             unverifiable (Codex P2).
#     Force-push AFTER a successful comment-shape post naturally
#     invalidates the gate because the new HEAD has no status check
#     posted; a fresh `@codex review` nudge re-fires this path.
#
# What "passing" means: Codex has submitted a review for the current head
# SHA **and that review raised no P0/P1**. The gate covers review LATENCY
# (review must happen before merge — the gap PR #84 surfaced) AND review
# SEVERITY (SAN-314).
#
# SEVERITY (SAN-314, 2026-08-06). Until this change the shim posted
# `success` on any Codex response, so at the merge button "codex-review
# passed" and "Codex found nothing serious" were different statements that
# looked identical — and auto-merge landed P1s behind a green check.
# Measured, not theorised: eva-chen PR #25 merged as c1b33b3 with
# codex-review=SUCCESS while Codex had filed 2 P1 + 2 P2 on that head. A
# 14-PR sample taken while writing this found SEVEN more carrying a P1
# under a green check.
#
# WHERE THE SEVERITY LIVES — the part that makes the naive fix wrong.
# Codex puts findings in TWO places, and a gate that reads only one of
# them reproduces the bug:
#   1. Inline review comments (`pulls/{n}/comments`). This is the usual
#      shape — eva-chen #25's 2 P1 were here and the review BODY was pure
#      boilerplate ("Here are some automated review suggestions"). Parsing
#      only the body would have posted green on the very merge that
#      motivated this ticket.
#   2. The review body itself. media-capture-app #43 has zero inline
#      comments and a P1 in the body. Parsing only the comments would
#      have missed that one.
# Both are scanned. Each finding is rendered as a shields.io badge —
# `**<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange…)`— so
# the alt text and the badge URL both carry the level.
#
# BINDING: findings are matched to reviews via `pull_request_review_id`,
# NOT via the comment's own `commit_id`. A review comment's `commit_id`
# tracks the diff as the PR advances, so a fixed-and-re-pushed P1 could
# keep failing forever. Anchoring on the review that raised it means a new
# head SHA starts from a clean slate, exactly like the latency gate does.
#
# FAIL CLOSED ON FORMAT DRIFT: Codex only leaves inline comments when it
# has findings, and every finding carries a P0–P3 badge. So a finding that
# matches NO severity pattern means the format moved under us — that posts
# `failure` with an explicit description rather than silently grading it
# green. This is the one guard that keeps a future Codex re-skin from
# quietly restoring the original bug.
#
# BREAK GLASS: a false-positive P1 must not wedge a PR forever. Applying
# the `codex-p1-ack` label posts `success` with the override named in the
# status description, so the dismissal is a visible act rather than a
# silent one. The override only ever downgrades a SEVERITY verdict: it
# requires a `codex-review` status to already exist on this head SHA, so
# it cannot be used to skip review altogether. Label changes re-run this
# workflow (see the `labeled`/`unlabeled` triggers).
#
# Status check context name is `codex-review` (not `codex` — the latter
# would never fire because Codex doesn't post that name itself).
#
# Why never-post-pending instead of explicit-pending: any GET-then-POST
# guard has a TOCTOU race window where a pull_request run that started
# before Codex reviewed could overwrite a freshly-posted success with
# pending. Posting only on success eliminates the race entirely. The
# UX is identical from the merge-gate perspective — missing required
# check = waiting = blocked.

# Trigger: pull_request_target instead of pull_request. Codex P1 round 6
# caught that pull_request runs the workflow from the PR's branch — a
# contributor could modify this file in their PR to post
# codex-review=success for their own SHA before Codex reviews, bypassing
# the gate this shim is meant to enforce.
#
# pull_request_target runs from the BASE BRANCH (main) instead, so the
# workflow code that owns this status is always the trusted version. This
# job never checks out the PR source (it only calls the GitHub API), so
# the standard pull_request_target risk — running untrusted PR code with
# elevated privileges — does not apply. As a side benefit
# pull_request_target also gives a writable GITHUB_TOKEN on fork PRs,
# which closes the earlier P2 about read-only token on forks.
#
# issue_comment runs from the default branch as well, so the same
# trust-the-base-branch property holds for the comment-shape path.
on:
  pull_request_target:
    # labeled/unlabeled are here for the `codex-p1-ack` break-glass path
    # (SAN-314). Applying a label fires no other trigger, so without these
    # the override could never post and a false-positive P1 would wedge the
    # PR until someone pushed a commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Deduplicate repeats of the SAME event only. pull_request_target and
# pull_request_review both legitimately run for one SHA — the first looks
# for an existing Codex review, the second fires when a review lands — so
# grouping across events could cancel the run that was about to post the
# status and leave the PR blocked forever.
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  # CANCEL ONLY THE PUSH-DRIVEN PATH. pull_request_target repeats when you push
  # again, and the older run is genuinely superseded. pull_request_review and
  # issue_comment are ONE-SHOT events carrying information no later run
  # reproduces: cancelling them can kill the very run that was about to post
  # `codex-review`, and the replacement (a human comment, author != the Codex
  # bot) will not post it — leaving the required check missing forever on a PR
  # that WAS reviewed. Introduced and caught in review the same day. (Codex P2.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  pull-requests: read
  statuses: write
  checks: write
  # actions: read is required by the comment-shape anti-stale guard so it
  # can query workflow_runs for trustworthy push timestamps. commit dates
  # on the commit object are gameable (Codex P1 #2, AHAD-15 own-PR review).
  actions: read
  # issues: read backs the `codex-p1-ack` break-glass path — the PR
  # timeline is served by the issues API and is where the label's actor
  # comes from, so an override can name who made it (SAN-314).
  issues: read

jobs:
  post-status:
    # issue_comment fires for both issue and PR comments — skip non-PR comments.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PR_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE_EVENT: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Always resolve from the API so the SHA is consistent across
          # event types: review.submitted gives review.commit_id which can
          # lag the actual PR head by a tick during rapid pushes; issue_comment
          # carries no SHA at all (it's tied to the issue/PR, not the commit).
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="$PR_FROM_ISSUE_EVENT"
          else
            pr_number="$PR_FROM_PR_EVENT"
          fi
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.sha')
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr_number} head SHA: ${head_sha}"

      # PASSIVE-PROSE CARVE-OUT (aios-specific, 2026-08-05).
      #
      # Robb named these surfaces as documentation-shaped, not code Codex
      # should evaluate. The previous aios-local workflow expressed that as a
      # `paths-ignore:` on the trigger — which is a TRAP once `codex-review` is
      # a REQUIRED check: a workflow that never runs never reports, and branch
      # protection shows "Waiting for status to be reported" forever. A
      # docs-only PR would have been permanently unmergeable.
      #
      # So the carve-out moves INSIDE the job: the workflow always runs and
      # always reports. A passive-prose-only diff posts success immediately with
      # a description that says why, so the exemption is visible on the PR rather
      # than silent. Operative agent policy (SKILL.md, CLAUDE.md, AGENTS.md,
      # bin/**, .github/**) is deliberately NOT exempt — it is executable
      # instruction, not prose.
      - name: Passive-prose carve-out
        id: docsonly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No files resolved; not treating as docs-only (fail closed)."
            exit 0
          fi
          non_prose=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              decisions/*|references/*|context/*|README.md|LICENSE) ;;
              *) non_prose=1 ;;
            esac
          done <<< "$files"
          if [ "$non_prose" -eq 0 ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "All changed files are passive prose; exempting."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post carve-out status
        if: steps.docsonly.outputs.docs_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="success" \
            -f context="codex-review" \
            -f description="exempt: passive prose only (decisions/references/context/README/LICENSE)" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=success (passive-prose carve-out) on ${HEAD_SHA}"

      - name: Determine Codex approval (formal review or @-mention comment)
        if: steps.docsonly.outputs.docs_only != 'true'
        id: codex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_TIME: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail

          # Path A — formal pull_request_review on the current head SHA.
          # Always run this check. Pagination: GitHub returns reviews in
          # chronological order (oldest first), so a long-lived PR with
          # many force-pushes could push the latest Codex review onto page
          # 2+. `--paginate` fetches every page; `jq -s` (slurp) aggregates
          # before filtering. The per-page jq form (`--paginate --jq ...`)
          # emits one length per page and doesn't compose under bash
          # integer comparison.
          reviewed=$(
            gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
              | jq -s "[.[] | .[] | select(.user.login == \"chatgpt-codex-connector[bot]\") | select(.commit_id == \"${HEAD_SHA}\")] | length"
          )

          # Path B — issue_comment from chatgpt-codex-connector[bot] with
          # a Codex-Review prefix. Only consider this on issue_comment
          # events. Two-stage validation:
          #   B1. Prefix guard on body: rejects refusal/non-review shapes.
          #   B2. Anti-stale-bypass guard: confirms HEAD didn't advance
          #       between the @codex-review nudge and the bot response.
          #       Without this, a contributor could request review at
          #       SHA A, force-push SHA B before Codex finishes, and the
          #       bot's reply would falsely stamp SHA B as reviewed.
          #       (Codex P1, AHAD-15 own-PR review.)
          # A subsequent force-push AFTER the comment naturally invalidates
          # the gate because the new HEAD has no status check posted; a
          # fresh @codex-review nudge re-fires this path.
          commented=0
          if [ "$EVENT_NAME" = "issue_comment" ] \
             && [ "$COMMENT_USER" = "chatgpt-codex-connector[bot]" ]; then
            # B1 — defensive prefix guard. Two known Codex review-comment
            # shapes (samples 2026-05-05 across portfolio):
            #   1. "Codex Review: Didn't find any major issues..."
            #      — first content line starts with `Codex Review:`
            #   2. "\n### 💡 Codex Review\n\n[diff link]\n**P1 Badge | ..."
            #      — first non-blank line is `### 💡 Codex Review` (own
            #        line, optional emoji, exact phrase, no colon)
            # Both indicate a real review submission. The guard rejects
            # hypothetical refusal comments ("Sorry, I can't review this
            # PR because...") because they'd lack the leading `Codex
            # Review` token.
            #
            # head -3 covers shape 2's leading newline (line 1 is empty,
            # line 2 is the heading). The regex anchors `Codex Review`
            # to start-of-line (after optional `#{1,3} 💡 ` markdown),
            # then requires either end-of-line or a `:`.
            prefix_ok=0
            if printf '%s' "$COMMENT_BODY" | head -3 \
                | grep -qE '^[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]*$|:)'; then
              prefix_ok=1
            fi

            if [ "$prefix_ok" = "1" ]; then
              # B2 — bind comment to a stable head SHA. Codex sees the
              # diff at @-mention time; if HEAD advances before the bot
              # responds, the response is for the old commit.
              #
              # Mention selection. THIS bot response is for the OLDEST
              # @codex mention that hasn't already been replied-to. Pick
              # the earliest non-bot @codex mention that came AFTER the
              # prior Codex-Review-shape bot comment (or earliest of all
              # if none prior). Why not "latest mention before response":
              # an attacker could request review on SHA A, push SHA B,
              # then add a decoy `@codex` mention after the push so the
              # latest-mention-before-response heuristic accepts the bot
              # reply (which was for SHA A) as if it were for SHA B —
              # Codex P1 #3, AHAD-15 own-PR review.
              # The "is this a Codex Review-shape bot comment" pattern
              # matches both observed shapes:
              #   - Shape A "Codex Review: ..." (start-of-string)
              #   - Shape B "\n### 💡 Codex Review\n..." (start-of-line
              #     after the leading blank line of markdown shape)
              # Codex P1 #4 (AHAD-15 own-PR review): the previous regex
              # `^.{0,100}Codex Review` failed shape B because `.` does
              # not consume newlines in Oniguruma without a flag — the
              # markdown shape's leading newline placed `Codex Review`
              # past where `^.{0,100}` could anchor. Using `(^|\n)`
              # explicitly matches both start-of-string and after-newline.
              prior_bot_review_time=$(
                gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                  | jq -s -r --arg t "$COMMENT_TIME" \
                    '[.[] | .[] | select(.user.login == "chatgpt-codex-connector[bot]") | select(.created_at < $t) | select(.body | test("(^|\n)[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]|:|$)"; "")) | .created_at] | sort | last // ""'
              )

              mention_time=$(
                gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                  | jq -s -r --arg t "$COMMENT_TIME" --arg p "$prior_bot_review_time" \
                    '[.[] | .[] | select(.user.login != "chatgpt-codex-connector[bot]") | select(.created_at < $t) | select($p == "" or .created_at > $p) | select(.body | test("@codex"; "i")) | .created_at] | sort | first // ""'
              )

              if [ -z "$mention_time" ]; then
                echo "Comment-shape rejected: no @codex mention found before bot response — auto-review path requires formal pull_request_review."
              else
                # Push-time proxy: latest pull_request_target workflow run
                # on the current HEAD SHA. Why not commit.committer.date:
                # that timestamp lives on the commit object and is set by
                # the committer (gameable — `git commit --date=2020-01-01`
                # would defeat the gate, Codex P1 #2). Why not commit
                # timeline events: their `created_at` mirrors committer.date.
                # actions/runs filtered to event=pull_request_target gives
                # only opened/synchronize/reopened triggers — those are
                # genuine push proofs whose `created_at` is server-side.
                # VERIFIED 2026-08-05 — do not "fix" this to use the base SHA.
                # A Codex pre-push review raised a P1 claiming that for
                # pull_request_target runs GitHub associates the run's head_sha
                # with the base/ref context rather than the PR head, which would
                # make this filter match nothing and block every comment-shaped
                # review forever. That claim is FALSE on this repo. Checked
                # against five real runs:
                #   run 30976459309 head_sha=ff516c2 == PR #163 head ff516c2
                #   run 30980480608 head_sha=792c475 == PR #164 head 792c475
                # pull_request_target runs DO carry the PR head SHA. Applying the
                # suggested fix would have broken a working anti-stale guard.
                latest_push_time=$(
                  gh api --paginate "repos/${{ github.repository }}/actions/runs?event=pull_request_target&head_sha=${HEAD_SHA}" \
                    | jq -s -r '[.[] | .workflow_runs[] | .created_at] | sort | last // ""'
                )

                # ISO-8601 UTC strings (e.g. 2026-05-06T07:43:18Z) sort
                # lexicographically because all components are zero-padded
                # fixed-width and the timezone is uniform. `\<` invokes
                # POSIX [ string comparison.
                #
                # Strict <: equal-second values are treated as unverifiable
                # and rejected (Codex P2, AHAD-15 own-PR re-review). GitHub
                # truncates created_at to whole seconds; an automated caller
                # could mention and force-push within the same UTC second
                # and otherwise sneak past an `<=` comparison.
                if [ -z "$latest_push_time" ]; then
                  echo "Comment-shape rejected: no pull_request_target run found for ${HEAD_SHA} — cannot verify push time."
                elif [ "$latest_push_time" \< "$mention_time" ]; then
                  commented=1
                  echo "Comment-shape accepted: mention at $mention_time, last push at $latest_push_time, response at $COMMENT_TIME."
                else
                  echo "Comment-shape rejected: HEAD push at $latest_push_time is not strictly before @codex-review mention at $mention_time — equal-second or later treated as stale."
                fi
              fi
            fi
          fi

          # `reviewed` / `commented` are exported so the severity step knows
          # WHICH path proved the review, and therefore where to look for
          # findings: path A findings live on the reviews, path B findings
          # live in the triggering comment body. (SAN-314.)
          echo "reviewed=${reviewed}" >> "$GITHUB_OUTPUT"
          echo "commented=${commented}" >> "$GITHUB_OUTPUT"

          if [ "${reviewed}" -gt 0 ] || [ "${commented}" -gt 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            if [ "${reviewed}" -gt 0 ]; then
              echo "description=Codex reviewed this commit" >> "$GITHUB_OUTPUT"
              echo "Codex reviewed via formal PR review for ${HEAD_SHA}: success"
            else
              echo "description=Codex reviewed via @-mention comment" >> "$GITHUB_OUTPUT"
              echo "Codex reviewed via @-mention comment for ${HEAD_SHA}: success"
            fi
          else
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "description=Awaiting Codex review on this commit" >> "$GITHUB_OUTPUT"
            echo "Codex has NOT yet reviewed ${HEAD_SHA}: pending"
          fi

      # ---------------------------------------------------------------
      # SEVERITY (SAN-314). "Codex responded" is not "Codex was happy".
      # Grade the findings Codex filed against THIS head SHA and decide
      # whether the required check should be success or failure.
      # ---------------------------------------------------------------
      - name: Grade finding severity
        if: steps.docsonly.outputs.docs_only != 'true'
        id: severity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REVIEWED: ${{ steps.codex.outputs.reviewed }}
          COMMENTED: ${{ steps.codex.outputs.commented }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Codex renders every finding with a shields.io severity badge:
          #   **<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange?style=flat)</sub></sub>  Title**
          # Both the alt text and the badge URL carry the level, so either
          # anchor alone is sufficient — matching both is belt and braces
          # against one of the two being restyled. The trailing shapes
          # (`[P1]`, `**P1**`, `P1:`) cover the plainer prose summaries.
          #
          # `[^A-Za-z0-9/]` before the bare-token alternative is what stops
          # the badge URL's own `…/badge/P1-orange` path segment from being
          # double-counted, and stops words like "GP1" matching.
          #
          # VERIFIED against 14 real PRs across 5 repos before rollout
          # (7 with a P0/P1, 7 without): 14/14 agreement with an
          # independent hand-check, no false pass, no false block, and no
          # finding that failed to classify. Do not loosen these without
          # re-running that comparison — a false PASS here is invisible and
          # restores the exact bug this closes.
          # One spelling, two engines: jq's --arg passes the pattern through
          # uninterpreted, so the same single-backslash form is valid for
          # both jq's test() and grep -E below. Verified as a truth table
          # rather than assumed — the doubled-backslash form ALSO appears to
          # work, for the wrong reason, which is precisely the kind of thing
          # that rots silently.
          BLOCKING='(P[01][[:space:]]+Badge|badge/P[01]-|\[P[01]\]|\*\*P[01]\*\*|(^|[^A-Za-z0-9/])P[01][[:space:]]*[:.)])'
          CLASSIFIED='(P[0-3][[:space:]]+Badge|badge/P[0-3]-|\[P[0-3]\]|\*\*P[0-3]\*\*|(^|[^A-Za-z0-9/])P[0-3][[:space:]]*[:.)])'

          blocking=0
          unclassified=0
          findings=0

          # --- Path A: findings attached to formal reviews on this SHA ---
          # Two paginated calls total, regardless of review count. Reviews
          # and comments are joined in jq on pull_request_review_id.
          if [ "${REVIEWED:-0}" -gt 0 ]; then
            reviews_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" | jq -s '[.[] | .[]]')
            comments_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')

            read -r findings blocking unclassified < <(
              jq -n -r \
                --argjson reviews "$reviews_json" \
                --argjson comments "$comments_json" \
                --arg sha "$HEAD_SHA" \
                --arg blocking "$BLOCKING" \
                --arg classified "$CLASSIFIED" '
                def bot: "chatgpt-codex-connector[bot]";

                ($reviews | map(select(.user.login == bot and .commit_id == $sha))) as $rv
                | ($rv | map(.id)) as $ids

                # Top-level inline comments belonging to those reviews.
                # in_reply_to_id == null drops conversational replies
                # ("@codex address that feedback"), which are not findings
                # and would otherwise trip the unclassified guard.
                | ($comments | map(select(
                    .user.login == bot
                    and .in_reply_to_id == null
                    and ((.pull_request_review_id) as $p | $ids | index($p)) != null
                  ))) as $fx

                | ( [ $rv[] | (.body // "") | select(test($blocking)) ] | length ) as $body_blocking
                | ( [ $fx[] | .body | select(test($blocking)) ] | length ) as $fx_blocking
                | ( [ $fx[] | .body | select(test($classified) | not) ] | length ) as $fx_unclassified

                | [ ($fx | length), ($body_blocking + $fx_blocking), $fx_unclassified ]
                | @tsv
              '
            )
          fi

          # --- Path B: findings stated in the @-mention response body ---
          # Path B is usually the clean shape ("Codex Review: Didn't find
          # any major issues"), but if Codex ever states a P1 there it must
          # block just the same. No unclassified guard here: prose is not
          # the badge-per-finding format, so absence of a badge is normal.
          if [ "${COMMENTED:-0}" -gt 0 ]; then
            if printf '%s' "$COMMENT_BODY" | grep -qE "$BLOCKING"; then
              blocking=$((blocking + 1))
              echo "Path B: blocking severity stated in the Codex comment body."
            fi
          fi

          echo "blocking=${blocking}" >> "$GITHUB_OUTPUT"
          echo "unclassified=${unclassified}" >> "$GITHUB_OUTPUT"
          echo "Severity on ${HEAD_SHA}: findings=${findings} blocking=${blocking} unclassified=${unclassified}"

      # ---------------------------------------------------------------
      # BREAK GLASS (SAN-314). A false-positive P1 must not wedge a PR.
      # `codex-p1-ack` downgrades a severity FAILURE to success, named in
      # the description so the dismissal is visible on the PR.
      #
      # It cannot be used to skip review: the override requires a
      # `codex-review` status to ALREADY exist on this head SHA, which
      # only ever gets posted after Codex has actually reviewed it.
      # ---------------------------------------------------------------
      - name: Resolve break-glass override
        if: steps.docsonly.outputs.docs_only != 'true'
        id: override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          has_label=$(
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | index("codex-p1-ack") != null'
          )
          if [ "$has_label" != "true" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No codex-p1-ack label; no override."
            exit 0
          fi

          # Anti-bypass: the label only downgrades an existing verdict.
          existing=$(
            gh api --paginate "repos/${{ github.repository }}/commits/${HEAD_SHA}/statuses" \
              | jq -s '[.[] | .[] | select(.context == "codex-review")] | length'
          )
          if [ "$existing" -eq 0 ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "codex-p1-ack present but no codex-review status exists on ${HEAD_SHA} — Codex has not reviewed this commit, so there is nothing to override."
            exit 0
          fi

          actor=$(
            gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/timeline" \
              | jq -s -r '[.[] | .[] | select(.event == "labeled") | select(.label.name == "codex-p1-ack") | .actor.login] | last // "unknown"'
          )
          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "actor=${actor}" >> "$GITHUB_OUTPUT"
          echo "Override active: codex-p1-ack applied by ${actor}."

      # ---------------------------------------------------------------
      # Final verdict. Three outcomes, one of which is new:
      #   success  — Codex reviewed, no P0/P1 (or override applied)
      #   failure  — Codex reviewed and filed a P0/P1  <-- SAN-314
      #   no post  — Codex has not reviewed this SHA (blocking, as before)
      # ---------------------------------------------------------------
      - name: Decide status to post
        if: steps.docsonly.outputs.docs_only != 'true'
        id: verdict
        env:
          REVIEW_STATE: ${{ steps.codex.outputs.state }}
          BASE_DESCRIPTION: ${{ steps.codex.outputs.description }}
          BLOCKING: ${{ steps.severity.outputs.blocking }}
          UNCLASSIFIED: ${{ steps.severity.outputs.unclassified }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          OVERRIDE_ACTOR: ${{ steps.override.outputs.actor }}
        run: |
          set -euo pipefail

          blocking="${BLOCKING:-0}"
          unclassified="${UNCLASSIFIED:-0}"

          if [ "$REVIEW_STATE" != "success" ]; then
            # Codex has not reviewed this SHA by either path. Unchanged
            # behaviour: post nothing, because a missing required check is
            # already the blocking signal and posting `pending` reopens the
            # TOCTOU race documented below.
            #
            # One exception: an override on a PR whose review arrived via
            # the comment path. That path's SHA binding is timing-based and
            # cannot be recomputed on a later `labeled` run, so without this
            # a path-B severity failure could never be broken out of.
            if [ "${OVERRIDE:-false}" = "true" ]; then
              echo "post=true" >> "$GITHUB_OUTPUT"
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "description=P0/P1 dismissed via codex-p1-ack by ${OVERRIDE_ACTOR}" >> "$GITHUB_OUTPUT"
              echo "Override applied to an existing verdict on this SHA."
            else
              echo "post=false" >> "$GITHUB_OUTPUT"
              echo "Codex has not reviewed this SHA; posting nothing."
            fi
            exit 0
          fi

          echo "post=true" >> "$GITHUB_OUTPUT"

          if [ "$blocking" -gt 0 ] || [ "$unclassified" -gt 0 ]; then
            if [ "${OVERRIDE:-false}" = "true" ]; then
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "description=P0/P1 dismissed via codex-p1-ack by ${OVERRIDE_ACTOR}" >> "$GITHUB_OUTPUT"
              echo "Blocking findings present but dismissed by ${OVERRIDE_ACTOR}."
            elif [ "$blocking" -gt 0 ]; then
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=Codex filed ${blocking} P0/P1 on this commit — fix, or label codex-p1-ack" >> "$GITHUB_OUTPUT"
              echo "FAILURE: ${blocking} blocking finding(s)."
            else
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=${unclassified} Codex finding(s) of unreadable severity — needs a human look" >> "$GITHUB_OUTPUT"
              echo "FAILURE: ${unclassified} unclassified finding(s); failing closed on format drift."
            fi
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=${BASE_DESCRIPTION} — no P0/P1" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: reviewed, no blocking findings."
          fi

      - name: Post commit status (graded verdict — never post pending)
        if: steps.verdict.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
        run: |
          set -euo pipefail

          # Only post when Codex has actually reviewed this commit.
          # Skipping the `pending` post entirely eliminates the race where
          # a pull_request run that GETs before Codex submits, then POSTs
          # after the pull_request_review run already posted success,
          # would regress the status. Any GET-then-POST guard still has a
          # TOCTOU window; the cleaner fix is "no pending post."
          #
          # UX: a missing required status check shows as "Waiting for
          # status to be reported" in branch-protection's merge UI, which
          # is exactly the pending semantics we wanted from the explicit
          # pending state. Branch protection treats a missing required
          # check as blocking — equivalent to pending for gating purposes.
          #
          # SAN-314: `state` is now graded rather than hardcoded to
          # success. The residual race this leaves is benign and points the
          # safe way: a slow run that graded an OLD review can only
          # overwrite a newer success with a FAILURE, never the reverse, so
          # the worst case blocks a mergeable PR (visible, cleared by a
          # re-run) instead of releasing an unreviewed one.
          #
          # GitHub truncates status descriptions at 140 characters.
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="codex-review" \
            -f description="${DESCRIPTION}" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=${STATE} on ${HEAD_SHA}: ${DESCRIPTION}"
