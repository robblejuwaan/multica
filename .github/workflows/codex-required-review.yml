name: Codex Required Review

# Posts a `codex-review` GitHub status check on a PR's head commit so
# branch protection can require Codex to actually review before merge.
#
# Why this exists: chatgpt-codex-connector emits PR reviews but does NOT
# emit GitHub Actions check-runs or commit statuses. Branch protection's
# `required_status_checks.contexts` can only require a status check, not
# a PR review. Without this shim, "require Codex review" can't be
# enforced — see docs/audits/2026-05-04-codex-portfolio-audit.md.
#
# Codex has TWO observed response shapes (AHAD-15, 2026-05-05):
#   A. Formal PR review (auto-triggered on PR open). Fires the
#      pull_request_review event. Detected via the reviews API
#      with commit_id == head SHA.
#   B. Issue-comment reply to an `@codex review` mention. Does NOT
#      fire pull_request_review. Detected via issue_comment event on
#      the PR with author == chatgpt-codex-connector[bot] and a body
#      whose first content line starts with `Codex Review` (matches
#      both `Codex Review: Didn't find any major issues...` and
#      `### 💡 Codex Review` markdown shapes).
#
# Shape B was the bin#7 stall (AHAD-12, 77 min open with required check
# never posted) — Codex had reviewed via comment, but the shim only
# listened for shape A.
#
# Behavior:
#   - On PR open / synchronize / reopened: post `codex-review` as
#     `success` if a Codex formal review already exists for the head
#     SHA; otherwise post nothing (the missing required check is the
#     pending signal — branch protection treats it as blocking).
#   - On Codex submitting a formal review (pull_request_review event):
#     post `codex-review` as `success` for that head commit.
#   - On Codex commenting via @-mention (issue_comment event from
#     chatgpt-codex-connector[bot]): post `codex-review` as `success`
#     for the current head SHA, gated on TWO checks:
#       (1) Prefix guard — body's first content line matches
#           `Codex Review` (rejects refusals + non-review comments).
#       (2) Anti-stale-bypass — HEAD wasn't pushed between the
#           review request and the bot response. Composed of:
#           - Mention selection: the @codex mention this response
#             is for is the OLDEST unanswered one — earliest
#             non-bot @codex comment after the last bot
#             Codex-Review-shape comment (Codex P1 #3, AHAD-15
#             own-PR review). Latest-mention heuristics let an
#             attacker decoy a stale response onto a new SHA.
#           - Push timestamp: from `actions/runs` filtered to
#             `event=pull_request_target`, which is server-side
#             and ungameable. `commit.committer.date` lives on
#             the commit object and `git commit --date=…` would
#             defeat that gate (Codex P1 #2).
#           - Comparison: STRICT `<` so equal-second push/mention
#             pairs (same UTC second) are rejected as
#             unverifiable (Codex P2).
#     Force-push AFTER a successful comment-shape post naturally
#     invalidates the gate because the new HEAD has no status check
#     posted; a fresh `@codex review` nudge re-fires this path.
#
# What "passing" means: Codex has submitted a review for the current head
# SHA **and that review raised no P0/P1**. The gate covers review LATENCY
# (review must happen before merge — the gap PR #84 surfaced) AND review
# SEVERITY (SAN-314).
#
# SEVERITY (SAN-314, 2026-08-06). Until this change the shim posted
# `success` on any Codex response, so at the merge button "codex-review
# passed" and "Codex found nothing serious" were different statements that
# looked identical — and auto-merge landed P1s behind a green check.
# Measured, not theorised: eva-chen PR #25 merged as c1b33b3 with
# codex-review=SUCCESS while Codex had filed 2 P1 + 2 P2 on that head. A
# 14-PR sample taken while writing this found SEVEN more carrying a P1
# under a green check.
#
# WHERE THE SEVERITY LIVES — the part that makes the naive fix wrong.
# Codex puts findings in TWO places, and a gate that reads only one of
# them reproduces the bug:
#   1. Inline review comments (`pulls/{n}/comments`). This is the usual
#      shape — eva-chen #25's 2 P1 were here and the review BODY was pure
#      boilerplate ("Here are some automated review suggestions"). Parsing
#      only the body would have posted green on the very merge that
#      motivated this ticket.
#   2. The review body itself. media-capture-app #43 has zero inline
#      comments and a P1 in the body. Parsing only the comments would
#      have missed that one.
# Both are scanned. Each finding is rendered as a shields.io badge —
# `**<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange…)`— so
# the alt text and the badge URL both carry the level.
#
# BINDING: findings are matched to reviews via `pull_request_review_id`,
# NOT via the comment's own `commit_id`. A review comment's `commit_id`
# tracks the diff as the PR advances, so a fixed-and-re-pushed P1 could
# keep failing forever. Anchoring on the review that raised it means a new
# head SHA starts from a clean slate, exactly like the latency gate does.
#
# FAIL CLOSED ON FORMAT DRIFT: Codex only leaves inline comments when it
# has findings, and every finding carries a P0–P3 badge. So a finding that
# matches NO severity pattern means the format moved under us — that posts
# `failure` with an explicit description rather than silently grading it
# green. This is the one guard that keeps a future Codex re-skin from
# quietly restoring the original bug.
#
# BREAK GLASS: a false-positive P1 must not wedge a PR forever. Apply the
# `codex-p1-ack` label, then comment on the PR to re-check — the comment
# is what re-runs this workflow, because label events are deliberately not
# triggers (see above). The status then reads `success` naming who
# dismissed it, so the act is visible rather than silent.
#
# WHO DISMISSED IT (SAN-343, porting SAN-321 + SAN-338 from `martin`). The
# label alone is NOT the acknowledgement. Every Santos agent authenticates
# as the shared token owner, so a label-only dismissal published
# `by robblejuwaan` for an act no human performed — the exact thing the
# break-glass log exists to prevent. The acting party now declares itself
# in a durable PR comment BEFORE applying the label:
#
#   <!-- codex-p1-ack: actor=<Your Name>; run=<multica run uuid> -->
#
# Then apply the label, then comment again to re-check (label events are
# deliberately not triggers here, see above). Comments posted after the
# label are ignored for identity, so the re-check comment is free-form.
#
# The marker must be authored by the same principal that applies the label,
# posted no more than ten minutes before it, after any earlier withdrawal,
# and never edited afterwards (an edited comment is not a marker). Exactly
# one marker may sit in that window. Anything else fails closed with
# `codex-p1-ack identity not established`, and an unvalidatable marker
# scopes NOTHING — every finding stays live.
#
# It is a SELF-DECLARATION and the status says so, reading
# `dismissed via codex-p1-ack by <name> (self-declared)`. GitHub cannot
# tell one agent on the shared token from another; what the marker buys is
# a durable, attributable record rather than a human's name on an act they
# did not perform. `actor=Robb` (in any spelling) is rejected outright, and
# so is martin's `source=manual` shape — this repo has no human branch and
# no status here will ever claim a human sign-off it cannot establish.
#
# The ack is TIME-SCOPED, not a permanent downgrade. It dismisses only
# findings from reviews submitted BEFORE the label went on. A later Codex
# review that raises a NEW P1 blocks again with no further human act.
# Without this, one label permanently downgraded the gate for that PR:
# Codex files more than one review on a single SHA routinely (eva-chen#25
# has two on 1a581734ec), and the second one's findings were being
# auto-greened. Found in review, SAN-314.
#
# WITHDRAWING the ack restores the block. That is not automatic — an
# earlier cut posted nothing at all on the withdrawal run for a
# comment-path review, leaving the override's stale `success` live on a PR
# with a known P0/P1 (Codex P1 on eva-chen#30, confirmed in review). Two
# things fix it: severity is now recomputed from DURABLE sources on every
# run (see below), and a withdrawal that cannot be re-graded fails closed
# rather than leaving the green in place.
#
# The ack can only ever downgrade a SEVERITY verdict — it never
# substitutes for review, because a status is only posted when Codex has
# actually reviewed this SHA.
#
# DURABLE SOURCES: severity is recomputed on every run from state that
# outlives the triggering event — the reviews on this head SHA, and the
# most recent Codex review-shaped issue comment that does not name a
# different commit. Nothing is read from `github.event.comment` any more.
# That is what makes an `unlabeled` re-check able to restore the failure:
# the evidence is still there to be re-read.
#
# Status check context name is `codex-review` (not `codex` — the latter
# would never fire because Codex doesn't post that name itself).
#
# Why never-post-pending instead of explicit-pending: any GET-then-POST
# guard has a TOCTOU race window where a pull_request run that started
# before Codex reviewed could overwrite a freshly-posted success with
# pending. Posting only on success eliminates the race entirely. The
# UX is identical from the merge-gate perspective — missing required
# check = waiting = blocked.

# Trigger: pull_request_target instead of pull_request. Codex P1 round 6
# caught that pull_request runs the workflow from the PR's branch — a
# contributor could modify this file in their PR to post
# codex-review=success for their own SHA before Codex reviews, bypassing
# the gate this shim is meant to enforce.
#
# pull_request_target runs from the BASE BRANCH (main) instead, so the
# workflow code that owns this status is always the trusted version. This
# job never checks out the PR source (it only calls the GitHub API), so
# the standard pull_request_target risk — running untrusted PR code with
# elevated privileges — does not apply. As a side benefit
# pull_request_target also gives a writable GITHUB_TOKEN on fork PRs,
# which closes the earlier P2 about read-only token on forks.
#
# issue_comment runs from the default branch as well, so the same
# trust-the-base-branch property holds for the comment-shape path.
on:
  pull_request_target:
    # DELIBERATELY NOT labeled/unlabeled. An earlier cut of SAN-314 added
    # those so the break-glass label could re-post on its own. It poisoned
    # the anti-stale push-time proxy below: label runs report as
    # `event=pull_request_target`, the runs API exposes `event` but NO
    # action field, so they cannot be filtered back out — a label change
    # between an `@codex` mention and the bot's reply pushed
    # latest_push_time past mention_time and false-blocked a valid
    # comment-shaped review. Codex P2 on eva-chen#30, confirmed in review.
    # The ack re-checks on the next natural run instead; see BREAK GLASS.
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Deduplicate repeats of the SAME event only. pull_request_target and
# pull_request_review both legitimately run for one SHA — the first looks
# for an existing Codex review, the second fires when a review lands — so
# grouping across events could cancel the run that was about to post the
# status and leave the PR blocked forever.
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  # CANCEL ONLY THE PUSH-DRIVEN PATH. pull_request_target repeats when you push
  # again, and the older run is genuinely superseded. pull_request_review and
  # issue_comment are ONE-SHOT events carrying information no later run
  # reproduces: cancelling them can kill the very run that was about to post
  # `codex-review`, and the replacement (a human comment, author != the Codex
  # bot) will not post it — leaving the required check missing forever on a PR
  # that WAS reviewed. Introduced and caught in review the same day. (Codex P2.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  pull-requests: read
  statuses: write
  checks: write
  # actions: read is required by the comment-shape anti-stale guard so it
  # can query workflow_runs for trustworthy push timestamps. commit dates
  # on the commit object are gameable (Codex P1 #2, AHAD-15 own-PR review).
  actions: read
  # issues: read backs the `codex-p1-ack` break-glass path — the PR
  # timeline is served by the issues API and is where the label's actor
  # comes from, so an override can name who made it (SAN-314).
  issues: read

jobs:
  post-status:
    # issue_comment fires for both issue and PR comments — skip non-PR comments.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PR_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE_EVENT: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Always resolve from the API so the SHA is consistent across
          # event types: review.submitted gives review.commit_id which can
          # lag the actual PR head by a tick during rapid pushes; issue_comment
          # carries no SHA at all (it's tied to the issue/PR, not the commit).
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="$PR_FROM_ISSUE_EVENT"
          else
            pr_number="$PR_FROM_PR_EVENT"
          fi
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.sha')
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr_number} head SHA: ${head_sha}"

      # PASSIVE-PROSE CARVE-OUT (aios-specific, 2026-08-05).
      #
      # Robb named these surfaces as documentation-shaped, not code Codex
      # should evaluate. The previous aios-local workflow expressed that as a
      # `paths-ignore:` on the trigger — which is a TRAP once `codex-review` is
      # a REQUIRED check: a workflow that never runs never reports, and branch
      # protection shows "Waiting for status to be reported" forever. A
      # docs-only PR would have been permanently unmergeable.
      #
      # So the carve-out moves INSIDE the job: the workflow always runs and
      # always reports. A passive-prose-only diff posts success immediately with
      # a description that says why, so the exemption is visible on the PR rather
      # than silent. Operative agent policy (SKILL.md, CLAUDE.md, AGENTS.md,
      # bin/**, .github/**) is deliberately NOT exempt — it is executable
      # instruction, not prose.
      - name: Passive-prose carve-out
        id: docsonly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No files resolved; not treating as docs-only (fail closed)."
            exit 0
          fi
          non_prose=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              decisions/*|references/*|context/*|README.md|LICENSE) ;;
              *) non_prose=1 ;;
            esac
          done <<< "$files"
          if [ "$non_prose" -eq 0 ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "All changed files are passive prose; exempting."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post carve-out status
        if: steps.docsonly.outputs.docs_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="success" \
            -f context="codex-review" \
            -f description="exempt: passive prose only (decisions/references/context/README/LICENSE)" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=success (passive-prose carve-out) on ${HEAD_SHA}"

      - name: Determine Codex approval (formal review or @-mention comment)
        if: steps.docsonly.outputs.docs_only != 'true'
        id: codex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_TIME: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail

          # Path A — formal pull_request_review on the current head SHA.
          # Always run this check. Pagination: GitHub returns reviews in
          # chronological order (oldest first), so a long-lived PR with
          # many force-pushes could push the latest Codex review onto page
          # 2+. `--paginate` fetches every page; `jq -s` (slurp) aggregates
          # before filtering. The per-page jq form (`--paginate --jq ...`)
          # emits one length per page and doesn't compose under bash
          # integer comparison.
          reviewed=$(
            gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
              | jq -s "[.[] | .[] | select(.user.login == \"chatgpt-codex-connector[bot]\") | select(.commit_id == \"${HEAD_SHA}\")] | length"
          )

          # Path B — issue_comment from chatgpt-codex-connector[bot] with
          # a Codex-Review prefix. Only consider this on issue_comment
          # events. Two-stage validation:
          #   B1. Prefix guard on body: rejects refusal/non-review shapes.
          #   B2. Anti-stale-bypass guard: confirms HEAD didn't advance
          #       between the @codex-review nudge and the bot response.
          #       Without this, a contributor could request review at
          #       SHA A, force-push SHA B before Codex finishes, and the
          #       bot's reply would falsely stamp SHA B as reviewed.
          #       (Codex P1, AHAD-15 own-PR review.)
          # A subsequent force-push AFTER the comment naturally invalidates
          # the gate because the new HEAD has no status check posted; a
          # fresh @codex-review nudge re-fires this path.
          commented=0
          if [ "$EVENT_NAME" = "issue_comment" ] \
             && [ "$COMMENT_USER" = "chatgpt-codex-connector[bot]" ]; then
            # B1 — defensive prefix guard. Two known Codex review-comment
            # shapes (samples 2026-05-05 across portfolio):
            #   1. "Codex Review: Didn't find any major issues..."
            #      — first content line starts with `Codex Review:`
            #   2. "\n### 💡 Codex Review\n\n[diff link]\n**P1 Badge | ..."
            #      — first non-blank line is `### 💡 Codex Review` (own
            #        line, optional emoji, exact phrase, no colon)
            # Both indicate a real review submission. The guard rejects
            # hypothetical refusal comments ("Sorry, I can't review this
            # PR because...") because they'd lack the leading `Codex
            # Review` token.
            #
            # head -3 covers shape 2's leading newline (line 1 is empty,
            # line 2 is the heading). The regex anchors `Codex Review`
            # to start-of-line (after optional `#{1,3} 💡 ` markdown),
            # then requires either end-of-line or a `:`.
            prefix_ok=0
            if printf '%s' "$COMMENT_BODY" | head -3 \
                | grep -qE '^[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]*$|:)'; then
              prefix_ok=1
            fi

            if [ "$prefix_ok" = "1" ]; then
              # B2 — bind comment to a stable head SHA. Codex sees the
              # diff at @-mention time; if HEAD advances before the bot
              # responds, the response is for the old commit.
              #
              # Mention selection. THIS bot response is for the OLDEST
              # @codex mention that hasn't already been replied-to. Pick
              # the earliest non-bot @codex mention that came AFTER the
              # prior Codex-Review-shape bot comment (or earliest of all
              # if none prior). Why not "latest mention before response":
              # an attacker could request review on SHA A, push SHA B,
              # then add a decoy `@codex` mention after the push so the
              # latest-mention-before-response heuristic accepts the bot
              # reply (which was for SHA A) as if it were for SHA B —
              # Codex P1 #3, AHAD-15 own-PR review.
              # The "is this a Codex Review-shape bot comment" pattern
              # matches both observed shapes:
              #   - Shape A "Codex Review: ..." (start-of-string)
              #   - Shape B "\n### 💡 Codex Review\n..." (start-of-line
              #     after the leading blank line of markdown shape)
              # Codex P1 #4 (AHAD-15 own-PR review): the previous regex
              # `^.{0,100}Codex Review` failed shape B because `.` does
              # not consume newlines in Oniguruma without a flag — the
              # markdown shape's leading newline placed `Codex Review`
              # past where `^.{0,100}` could anchor. Using `(^|\n)`
              # explicitly matches both start-of-string and after-newline.
              prior_bot_review_time=$(
                gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                  | jq -s -r --arg t "$COMMENT_TIME" \
                    '[.[] | .[] | select(.user.login == "chatgpt-codex-connector[bot]") | select(.created_at < $t) | select(.body | test("(^|\n)[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]|:|$)"; "")) | .created_at] | sort | last // ""'
              )

              mention_time=$(
                gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
                  | jq -s -r --arg t "$COMMENT_TIME" --arg p "$prior_bot_review_time" \
                    '[.[] | .[] | select(.user.login != "chatgpt-codex-connector[bot]") | select(.created_at < $t) | select($p == "" or .created_at > $p) | select(.body | test("@codex"; "i")) | .created_at] | sort | first // ""'
              )

              if [ -z "$mention_time" ]; then
                echo "Comment-shape rejected: no @codex mention found before bot response — auto-review path requires formal pull_request_review."
              else
                # Push-time proxy: latest pull_request_target workflow run
                # on the current HEAD SHA. Why not commit.committer.date:
                # that timestamp lives on the commit object and is set by
                # the committer (gameable — `git commit --date=2020-01-01`
                # would defeat the gate, Codex P1 #2). Why not commit
                # timeline events: their `created_at` mirrors committer.date.
                # actions/runs filtered to event=pull_request_target gives
                # only opened/synchronize/reopened triggers — those are
                # genuine push proofs whose `created_at` is server-side.
                # VERIFIED 2026-08-05 — do not "fix" this to use the base SHA.
                # A Codex pre-push review raised a P1 claiming that for
                # pull_request_target runs GitHub associates the run's head_sha
                # with the base/ref context rather than the PR head, which would
                # make this filter match nothing and block every comment-shaped
                # review forever. That claim is FALSE on this repo. Checked
                # against five real runs:
                #   run 30976459309 head_sha=ff516c2 == PR #163 head ff516c2
                #   run 30980480608 head_sha=792c475 == PR #164 head 792c475
                # pull_request_target runs DO carry the PR head SHA. Applying the
                # suggested fix would have broken a working anti-stale guard.
                latest_push_time=$(
                  gh api --paginate "repos/${{ github.repository }}/actions/runs?event=pull_request_target&head_sha=${HEAD_SHA}" \
                    | jq -s -r '[.[] | .workflow_runs[] | .created_at] | sort | last // ""'
                )

                # ISO-8601 UTC strings (e.g. 2026-05-06T07:43:18Z) sort
                # lexicographically because all components are zero-padded
                # fixed-width and the timezone is uniform. `\<` invokes
                # POSIX [ string comparison.
                #
                # Strict <: equal-second values are treated as unverifiable
                # and rejected (Codex P2, AHAD-15 own-PR re-review). GitHub
                # truncates created_at to whole seconds; an automated caller
                # could mention and force-push within the same UTC second
                # and otherwise sneak past an `<=` comparison.
                if [ -z "$latest_push_time" ]; then
                  echo "Comment-shape rejected: no pull_request_target run found for ${HEAD_SHA} — cannot verify push time."
                elif [ "$latest_push_time" \< "$mention_time" ]; then
                  commented=1
                  echo "Comment-shape accepted: mention at $mention_time, last push at $latest_push_time, response at $COMMENT_TIME."
                else
                  echo "Comment-shape rejected: HEAD push at $latest_push_time is not strictly before @codex-review mention at $mention_time — equal-second or later treated as stale."
                fi
              fi
            fi
          fi

          # `reviewed` / `commented` are exported so the severity step knows
          # WHICH path proved the review, and therefore where to look for
          # findings: path A findings live on the reviews, path B findings
          # live in the triggering comment body. (SAN-314.)
          echo "reviewed=${reviewed}" >> "$GITHUB_OUTPUT"
          echo "commented=${commented}" >> "$GITHUB_OUTPUT"

          if [ "${reviewed}" -gt 0 ] || [ "${commented}" -gt 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            if [ "${reviewed}" -gt 0 ]; then
              echo "description=Codex reviewed this commit" >> "$GITHUB_OUTPUT"
              echo "Codex reviewed via formal PR review for ${HEAD_SHA}: success"
            else
              echo "description=Codex reviewed via @-mention comment" >> "$GITHUB_OUTPUT"
              echo "Codex reviewed via @-mention comment for ${HEAD_SHA}: success"
            fi
          else
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "description=Awaiting Codex review on this commit" >> "$GITHUB_OUTPUT"
            echo "Codex has NOT yet reviewed ${HEAD_SHA}: pending"
          fi
      # ---------------------------------------------------------------
      # BREAK GLASS (SAN-314). Resolved FIRST because the severity grade
      # below is scoped to when the ack went on.
      # ---------------------------------------------------------------
      - name: Resolve break-glass override
        if: steps.docsonly.outputs.docs_only != 'true'
        id: override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          has_label=$(
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | index("codex-p1-ack") != null'
          )

          # The PR timeline is the only durable record of WHEN the ack went
          # on and whether it was later withdrawn. Both matter: the first
          # scopes which findings it covers, the second is what makes a
          # withdrawal restore the block instead of silently leaving green.
          timeline=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/timeline" | jq -s '[.[] | .[]]')
          label_time=$(printf '%s' "$timeline" | jq -r '[.[] | select(.event == "labeled") | select(.label.name == "codex-p1-ack") | .created_at] | sort | last // ""')
          unack_seen=$(printf '%s' "$timeline" | jq -r '[.[] | select(.event == "unlabeled") | select(.label.name == "codex-p1-ack")] | length')
          label_actor=$(printf '%s' "$timeline" | jq -r '[.[] | select(.event == "labeled") | select(.label.name == "codex-p1-ack") | .actor.login] | last // "unknown"')

          # ---------------------------------------------------------------
          # IDENTITY (SAN-343, porting SAN-321 + SAN-338 from `martin`).
          #
          # GitHub records every Santos agent as the shared token owner, so a
          # label-only acknowledgement is attributable to nobody: this gate
          # used to publish `dismissed via codex-p1-ack by robblejuwaan` for an
          # act no human performed. The break-glass log exists to answer "who
          # dismissed this P0/P1" and it was answering confidently and wrongly.
          #
          # So the actor declares itself in a durable, machine-readable PR
          # comment BEFORE applying the label:
          #
          #   <!-- codex-p1-ack: actor=<Agent Name>; run=<multica run uuid> -->
          #
          # The marker must be authored by the same principal that applies the
          # label, posted no more than ten minutes before it, and after the
          # most recent withdrawal. We deliberately do not look after the
          # label: that would let a later comment rewrite an acknowledgement's
          # history.
          #
          # THIS IS A SELF-DECLARATION AND THE STATUS SAYS SO. GitHub cannot
          # tell one agent on the shared token from another, so the marker
          # records who CLAIMS to have acted, not who provably did. What it
          # buys is a durable, attributable record on the PR and in the run
          # log, and no human name on an act no human performed.
          #
          # THERE IS NO MANUAL/HUMAN BRANCH HERE. `martin` carries one behind
          # an HMAC (CODEX_ACK_MANUAL_SECRET). SAN-338's independent review
          # established that its `(verified)` wording overstates what it
          # proves: anything that can push a workflow to a repo can read that
          # repo's secrets, so possession of the secret is not a signature.
          # These three repos never had a human branch, so none is added — a
          # human dismissing a finding here uses a named marker like anyone
          # else, and no status ever carries an unearned human name. A marker
          # SHAPED like martin's manual one fails closed with that explained.
          # ---------------------------------------------------------------
          comments='[]'
          marker_candidates='[]'
          if [ -n "$label_time" ]; then
            marker_window_start=$(date -u -d "${label_time} - 10 minutes" +%Y-%m-%dT%H:%M:%SZ)
            # A MARKER DIES WITH THE LABEL IT AUTHORISED. Without this cutoff:
            # remove the label, wait inside the ten minutes for Codex to file a
            # fresh P0/P1, put the label back — and the original marker would
            # re-authorise a dismissal of a finding its author never saw.
            # Strictly after, so an unlabel and a marker in the same UTC second
            # are unorderable and therefore rejected.
            last_unack_at=$(printf '%s' "$timeline" | jq -r --arg end "$label_time" '
              [ .[]
                | select(.event == "unlabeled")
                | select(.label.name == "codex-p1-ack")
                | select(.created_at <= $end)
                | .created_at ] | sort | last // ""')
            comments=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')
            # STRICTLY BEFORE THE LABEL. GitHub timestamps are second-
            # resolution, so a marker posted in the SAME second as the label is
            # unorderable — and since posting a comment is itself a trigger,
            # `<=` would let label-first-then-marker validate in the run that
            # very comment starts. Retroactive acknowledgement. Same doctrine
            # as the `>` on the withdrawal cutoff: unorderable resolves against
            # the merge. Codex P1 on eva-chen#35, santos-brand#6, multica#5.
            #
            # AN EDITED COMMENT IS NOT A MARKER. Editing preserves created_at
            # and only moves updated_at, so without this you can post an empty
            # comment now and edit a marker into it later while keeping the
            # earlier timestamp. GitHub sets updated_at == created_at on a
            # comment nobody has edited, so requiring equality rejects the
            # whole class. Cost: a typo fix invalidates the marker and needs a
            # fresh one, which fails in the safe direction.
            marker_candidates=$(printf '%s' "$comments" | jq -c --arg start "$marker_window_start" --arg end "$label_time" --arg label_actor "$label_actor" --arg unack "$last_unack_at" '
              [ .[]
                | select(.user.login == $label_actor)
                | select(.created_at == .updated_at)
                | select(.created_at >= $start and .created_at < $end)
                | select($unack == "" or .created_at > $unack)
                | select(.body | test("<!--\\s*codex-p1-ack\\s*:"))
              ] | sort_by(.created_at)')
            if [ -n "$last_unack_at" ]; then
              echo "codex-p1-ack was withdrawn at ${last_unack_at}; only markers posted after that count for the label at ${label_time}."
            fi
          fi
          marker=$(printf '%s' "$marker_candidates" | jq -c 'last // empty')
          marker_count=$(printf '%s' "$marker_candidates" | jq 'length')
          # When the marker was posted. THIS, not the label event, is what the
          # dismissal is scoped to: it is the moment the declaring actor could
          # see the findings it claims to dismiss.
          marker_at=$(printf '%s' "$marker" | jq -r '.created_at // ""')
          MARKER_RE="<!--\\s*codex-p1-ack\\s*:\\s*actor=(?<actor>[A-Za-z][A-Za-z .-]{0,70});\\s*run=(?<run>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\\s*-->"
          marker_actor=$(printf '%s' "$marker" | jq -r --arg re "$MARKER_RE" '.body // "" | try capture($re).actor catch empty')
          marker_run=$(printf '%s' "$marker" | jq -r --arg re "$MARKER_RE" '.body // "" | try capture($re).run catch empty')
          # Martin's manual shape, which this repo does not honour. Detected
          # separately so it fails closed with the real reason rather than a
          # generic "malformed marker".
          manual_shaped=$(printf '%s' "$marker" | jq -r 'if ((.body // "") | test("codex-p1-ack\\s*:[^>]*source=manual")) then "true" else "false" end')

          identity_valid=false
          actor="unknown"
          actor_kind="unverified"

          if [ "$has_label" != "true" ]; then
            :
          elif [ "$marker_count" -ne 1 ]; then
            echo "FAIL CLOSED: expected exactly one codex-p1-ack marker from ${label_actor} in the ten minutes before the label at ${label_time}; found ${marker_count}."
          elif [ "$manual_shaped" = "true" ]; then
            echo "FAIL CLOSED: this repository has no manual codex-p1-ack branch. Acknowledge under your own name: <!-- codex-p1-ack: actor=<Your Name>; run=<multica run uuid> --> (SAN-343)."
          elif [ -n "$marker_actor" ] && [ -n "$marker_run" ]; then
            # RESERVED NAME. Without this the misattribution simply moves into
            # the marker: `actor=Robb; run=<any uuid>` would publish the same
            # unearned human sign-off the port exists to remove. Compared on
            # LETTERS ONLY and ANYWHERE IN THE NAME, because the actor pattern
            # admits space, dot and hyphen — `Robb.`, `Robb-`, `Mr Robb` and
            # `R. Robb` all collapse onto one check that way (SAN-338 found
            # every one of those walking through a narrower rule).
            actor_norm=$(printf '%s' "$marker_actor" | tr -cd '[:alpha:]' | tr '[:upper:]' '[:lower:]')
            case "$actor_norm" in *robb*) reserved=1 ;; *) reserved=0 ;; esac
            if [ "$reserved" -eq 1 ]; then
              echo "FAIL CLOSED: a codex-p1-ack marker must name the acting agent; Robb cannot be claimed on this path (SAN-343)."
            else
              identity_valid=true
              actor="$marker_actor"
              actor_kind="self-declared"
              echo "Agent acknowledgement: ${actor}, run ${marker_run}, marker at ${marker_at}, label at ${label_time}."
            fi
          else
            echo "FAIL CLOSED: malformed or missing codex-p1-ack marker before the label at ${label_time}. Expected <!-- codex-p1-ack: actor=<Your Name>; run=<multica run uuid> --> (SAN-343)."
          fi

          prior=$(
            gh api --paginate "repos/${{ github.repository }}/commits/${HEAD_SHA}/statuses" \
              | jq -s -r '[.[] | .[] | select(.context == "codex-review")] | sort_by(.created_at) | last | .state // "none"'
          )

          # AN UNVALIDATABLE MARKER SCOPES NOTHING. Emitting a scope for a
          # claim this step just rejected would silence findings on the
          # strength of that rejected claim. Empty ack_time leaves every
          # finding live, and the verdict step turns that into a failure
          # whenever the acknowledgement was load-bearing.
          if [ "$has_label" = "true" ] && [ "$identity_valid" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "ack_time=${marker_at}" >> "$GITHUB_OUTPUT"
            echo "Override active: codex-p1-ack declared by ${actor} at ${marker_at} (label at ${label_time}); findings from that moment on still block."
          elif [ "$has_label" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "ack_time=" >> "$GITHUB_OUTPUT"
            echo "Override present but its identity could not be established; scoping nothing."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "ack_time=" >> "$GITHUB_OUTPUT"
          fi
          # CLAMPED: the declared actor is the only unbounded part of a status
          # description and GitHub truncates those at 140 characters. The
          # marker pattern admits 71 characters of name, enough to push the
          # trailing `(self-declared)` off the end — i.e. exactly the part that
          # stops the status reading as a verified sign-off.
          echo "actor=${actor:0:48}" >> "$GITHUB_OUTPUT"
          echo "actor_kind=${actor_kind}" >> "$GITHUB_OUTPUT"
          echo "identity_valid=${identity_valid}" >> "$GITHUB_OUTPUT"
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          # Withdrawn = the label has been removed at least once and is not
          # on now. Used to fail closed if severity cannot be re-derived.
          if [ "$has_label" != "true" ] && [ "${unack_seen}" -gt 0 ]; then
            echo "withdrawn=true" >> "$GITHUB_OUTPUT"
            echo "codex-p1-ack has been withdrawn on this PR."
          else
            echo "withdrawn=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      # SEVERITY (SAN-314). "Codex responded" is not "Codex was happy".
      #
      # Every input here is DURABLE — re-readable on any later run. That is
      # deliberate: an earlier cut graded the triggering comment out of
      # `github.event`, so a run fired by anything else could not re-derive
      # the verdict and posted nothing, stranding a stale `success`.
      # ---------------------------------------------------------------
      - name: Grade finding severity
        if: steps.docsonly.outputs.docs_only != 'true'
        id: severity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ACK_TIME: ${{ steps.override.outputs.ack_time }}
          PRIOR: ${{ steps.override.outputs.prior }}
        run: |
          set -euo pipefail

          # Stamped BEFORE any evidence is read, so it is a lower bound on
          # how fresh this run's snapshot is. The post step uses it to
          # refuse to overwrite a failure that was decided after we looked.
          snapshot_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "snapshot_at=${snapshot_at}" >> "$GITHUB_OUTPUT"

          # Codex renders every finding with a shields.io severity badge:
          #   **<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange?style=flat)</sub></sub>  Title**
          # Both the alt text and the badge URL carry the level, so either
          # anchor alone is sufficient — matching both is belt and braces
          # against one of the two being restyled. The trailing shapes
          # (`[P1]`, `**P1**`, `P1:`) cover the plainer prose summaries.
          #
          # `[^A-Za-z0-9/]` before the bare-token alternative is what stops
          # the badge URL's own `…/badge/P1-orange` path segment from being
          # double-counted, and stops words like "GP1" matching.
          #
          # One spelling, two engines: jq's --arg passes the pattern through
          # uninterpreted, so this single-backslash form is valid for both
          # jq's test() and grep -E. Verified as a truth table rather than
          # assumed — the doubled-backslash form ALSO appears to work, for
          # the wrong reason, which is exactly the kind of thing that rots.
          #
          # VERIFIED against 14 real PRs across 5 repos before rollout
          # (7 with a P0/P1, 7 without): 14/14 agreement with an
          # independent hand-check, no false pass, no false block, and no
          # finding that failed to classify. Do not loosen these without
          # re-running that comparison — a false PASS here is invisible and
          # restores the exact bug this closes.
          BLOCKING='(P[01][[:space:]]+Badge|badge/P[01]-|\[P[01]\]|\*\*P[01]\*\*|(^|[^A-Za-z0-9/])P[01][[:space:]]*[:.)])'
          CLASSIFIED='(P[0-3][[:space:]]+Badge|badge/P[0-3]-|\[P[0-3]\]|\*\*P[0-3]\*\*|(^|[^A-Za-z0-9/])P[0-3][[:space:]]*[:.)])'
          # Same Codex-Review prefix shapes the comment path already trusts.
          SHAPE='(^|\n)[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]|:|$)'

          reviews_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" | jq -s '[.[] | .[]]')
          comments_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')
          issue_json=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')

          read -r graded blocking_total unclassified_total blocking_live unclassified_live < <(
            jq -n -r \
              --argjson reviews "$reviews_json" \
              --argjson comments "$comments_json" \
              --argjson issues "$issue_json" \
              --arg sha "$HEAD_SHA" \
              --arg short "${HEAD_SHA:0:10}" \
              --arg ack "${ACK_TIME:-}" \
              --arg prior "${PRIOR:-none}" \
              --arg blocking "$BLOCKING" \
              --arg classified "$CLASSIFIED" \
              --arg shape "$SHAPE" '
              def bot: "chatgpt-codex-connector[bot]";

              # Formal reviews Codex submitted against THIS head SHA.
              ($reviews | map(select(.user.login == bot and .commit_id == $sha))) as $rv
              | ($rv | map(.id)) as $ids
              | ($rv | map({key: (.id | tostring), value: .submitted_at}) | from_entries) as $ts

              # Findings = top-level inline comments belonging to those
              # reviews. Anchoring on pull_request_review_id (not the
              # comment commit_id) keeps a finding tied to the review that
              # raised it, so a fixed + re-reviewed SHA starts clean.
              # in_reply_to_id == null drops conversational replies, which
              # are not findings and would trip the unclassified guard.
              | ($comments | map(select(
                  .user.login == bot
                  and .in_reply_to_id == null
                  and ((.pull_request_review_id) as $p | $ids | index($p)) != null
                ))) as $fx

              # Comment-path review. Codex usually states
              # "Reviewed commit: <short>", which binds the comment to a
              # SHA outright. Two buckets, because they are NOT equally
              # trustworthy:
              #
              #   $cm_bound   — names THIS head. Self-binding, always safe.
              #   $cm_untagged — names no commit at all. Admissible ONLY as
              #     re-grading evidence for a SHA the gate already accepted
              #     a review for (see $prior below).
              #
              # An earlier cut accepted untagged comments unconditionally.
              # That broke the latency gate outright: after a force-push to
              # an unreviewed SHA B, the old untagged comment still matched,
              # graded=1, and the verdict could post success on a commit
              # Codex had never seen. Codex P1 across 12 of the rollout PRs,
              # and correct — the approval step rejects that case, but its
              # result was not consulted here. Comments naming a DIFFERENT
              # commit fall into neither bucket and are simply ignored.
              | ([ $issues[]
                   | select(.user.login == bot)
                   | select(.body | test($shape))
                   | select(.body | contains($short))
                 ] | sort_by(.created_at) | last) as $cm_bound
              | ([ $issues[]
                   | select(.user.login == bot)
                   | select(.body | test($shape))
                   | select(.body | test("Reviewed commit:") | not)
                 ] | sort_by(.created_at) | last) as $cm_untagged
              | (if $cm_bound != null then $cm_bound
                 elif $prior != "none" then $cm_untagged
                 else null end) as $cm

              # One flat finding list: {ts, body, inline}. Review bodies and
              # the comment body count as one finding each; inline comments
              # count individually and inherit the timestamp of the review
              # that raised them. No apostrophes below this line: the jq
              # program is bash single-quoted, so one would end it early.
              | ( [ $rv[]  | {ts: .submitted_at, body: (.body // ""), inline: false} ]
                + [ $fx[]  | {ts: ($ts[(.pull_request_review_id | tostring)] // ""), body: (.body // ""), inline: true} ]
                + (if $cm == null then [] else [ {ts: $cm.created_at, body: ($cm.body // ""), inline: false} ] end)
                ) as $all

              # Live = not covered by the ack. An ack dismisses only what
              # existed when it was applied, so a later review still blocks.
              #
              # >= not >, deliberately. GitHub truncates timestamps to whole
              # seconds, so a review landing in the SAME second as the label
              # is unorderable — and under > it was silently treated as
              # acknowledged, letting a brand new P0/P1 post success. Equal
              # time therefore stays LIVE. Same doctrine as the strict < on
              # the push/mention comparison above: unverifiable ordering
              # resolves against the merge, never toward it. Codex P1.
              | ( $all | map(select($ack == "" or .ts >= $ack)) ) as $live

              | [ (if (($rv | length) > 0 or $cm != null) then 1 else 0 end),
                  ( [ $all[]  | select(.body | test($blocking)) ] | length ),
                  ( [ $all[]  | select(.inline) | select(.body | test($classified) | not) ] | length ),
                  ( [ $live[] | select(.body | test($blocking)) ] | length ),
                  ( [ $live[] | select(.inline) | select(.body | test($classified) | not) ] | length ) ]
              | @tsv
            '
          )

          echo "graded=${graded}" >> "$GITHUB_OUTPUT"
          echo "blocking_total=${blocking_total}" >> "$GITHUB_OUTPUT"
          echo "blocking=${blocking_live}" >> "$GITHUB_OUTPUT"
          echo "unclassified=${unclassified_live}" >> "$GITHUB_OUTPUT"
          echo "Severity on ${HEAD_SHA}: graded=${graded} blocking=${blocking_live}/${blocking_total} unclassified=${unclassified_live}/${unclassified_total} ack=${ACK_TIME:-none}"

      # ---------------------------------------------------------------
      # Final verdict:
      #   success  — Codex reviewed, no live P0/P1 (or all of them acked)
      #   failure  — Codex reviewed and filed a live P0/P1  <-- SAN-314
      #   failure  — an ack was withdrawn and cannot be re-graded
      #   no post  — Codex has not reviewed this SHA (blocking, as before)
      # ---------------------------------------------------------------
      - name: Decide status to post
        if: steps.docsonly.outputs.docs_only != 'true'
        id: verdict
        env:
          GRADED: ${{ steps.severity.outputs.graded }}
          BLOCKING: ${{ steps.severity.outputs.blocking }}
          BLOCKING_TOTAL: ${{ steps.severity.outputs.blocking_total }}
          UNCLASSIFIED: ${{ steps.severity.outputs.unclassified }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          OVERRIDE_ACTOR: ${{ steps.override.outputs.actor }}
          OVERRIDE_ACTOR_KIND: ${{ steps.override.outputs.actor_kind }}
          OVERRIDE_IDENTITY_VALID: ${{ steps.override.outputs.identity_valid }}
          WITHDRAWN: ${{ steps.override.outputs.withdrawn }}
          PRIOR: ${{ steps.override.outputs.prior }}
        run: |
          set -euo pipefail

          if [ "${GRADED:-0}" != "1" ]; then
            # Nothing durable to grade. Normally that means Codex has not
            # reviewed this SHA: post nothing, because a missing required
            # check already blocks and posting `pending` reopens the TOCTOU
            # race documented below.
            #
            # The exception is a WITHDRAWN ack sitting on top of a live
            # `success`. Leaving that alone is how a dismissal silently
            # failed to withdraw, so it fails closed instead.
            if [ "${WITHDRAWN:-false}" = "true" ] && [ "${PRIOR:-none}" = "success" ]; then
              echo "post=true" >> "$GITHUB_OUTPUT"
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=codex-p1-ack withdrawn and severity could not be re-derived — re-review needed" >> "$GITHUB_OUTPUT"
              echo "FAILURE: ack withdrawn, nothing durable to re-grade; failing closed rather than leaving the green."
            else
              echo "post=false" >> "$GITHUB_OUTPUT"
              echo "Codex has not reviewed this SHA; posting nothing."
            fi
            exit 0
          fi

          echo "post=true" >> "$GITHUB_OUTPUT"

          # Was the acknowledgement doing any work? If Codex filed nothing at
          # all it changed nothing, and an unvalidatable marker on a clean PR
          # should not manufacture a failure (SAN-343).
          ack_load_bearing=0
          if [ "${BLOCKING_TOTAL:-0}" -gt 0 ] || [ "${UNCLASSIFIED:-0}" -gt 0 ]; then
            ack_load_bearing=1
          fi

          # IDENTITY IS CHECKED FIRST. An unvalidatable marker now scopes
          # nothing, so every finding stays live and the BLOCKING clause below
          # would catch this case anyway — but it would report it as a plain
          # P0/P1. Leading with the identity message is the one that tells the
          # reader what to actually do about it.
          if [ "${OVERRIDE:-false}" = "true" ] && [ "$ack_load_bearing" -eq 1 ] && [ "${OVERRIDE_IDENTITY_VALID:-false}" != "true" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=codex-p1-ack identity not established — re-acknowledge with a valid PR marker" >> "$GITHUB_OUTPUT"
            echo "FAILURE: acknowledgement identity cannot be established; failing closed."
          elif [ "${BLOCKING:-0}" -gt 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Codex filed ${BLOCKING} P0/P1 on this commit — fix, or label codex-p1-ack" >> "$GITHUB_OUTPUT"
            echo "FAILURE: ${BLOCKING} live blocking finding(s)."
          elif [ "${UNCLASSIFIED:-0}" -gt 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=${UNCLASSIFIED} Codex finding(s) of unreadable severity — needs a human look" >> "$GITHUB_OUTPUT"
            echo "FAILURE: ${UNCLASSIFIED} unclassified finding(s); failing closed on format drift."
          elif [ "${OVERRIDE:-false}" = "true" ] && [ "${BLOCKING_TOTAL:-0}" -gt 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=${BLOCKING_TOTAL} P0/P1 dismissed via codex-p1-ack by ${OVERRIDE_ACTOR} (${OVERRIDE_ACTOR_KIND})" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: ${BLOCKING_TOTAL} finding(s) dismissed by ${OVERRIDE_ACTOR} (${OVERRIDE_ACTOR_KIND}); none raised since."
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Codex reviewed this commit — no P0/P1" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: reviewed, no blocking findings."
          fi


      - name: Post commit status (graded verdict — never post pending)
        if: steps.verdict.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          SNAPSHOT_AT: ${{ steps.severity.outputs.snapshot_at }}
        run: |
          set -euo pipefail

          # LAST-WRITER GUARD. Event types are separate concurrency groups
          # (the group key includes github.event_name), so a slow
          # pull_request_target run can still be in flight when a
          # pull_request_review run posts `failure` for a review that
          # landed after we read our evidence. Without this, the slow run
          # posts its stale `success` last and the P0/P1 goes green.
          #
          # This is not hypothetical: it is exactly how eva-chen#30 merged
          # with a live P1 — the base copy of this workflow posted success
          # over the head copy's failure at 05:04:51 and auto-merge fired
          # three seconds later. Codex P1 across the rollout PRs.
          #
          # Only `success` is held back. A `failure` may always overwrite,
          # because erring toward blocking is the safe direction, and a
          # missing/incorrect block is visible where a false green is not.
          if [ "${STATE}" = "success" ]; then
            newer_failure=$(
              gh api --paginate "repos/${{ github.repository }}/commits/${HEAD_SHA}/statuses" \
                | jq -s -r --arg t "${SNAPSHOT_AT:-}" '
                    [ .[] | .[]
                      | select(.context == "codex-review")
                      | select(.state == "failure")
                      | select($t == "" or .created_at > $t) ] | length'
            )
            if [ "${newer_failure}" -gt 0 ]; then
              echo "Refusing to post success on ${HEAD_SHA}: a codex-review failure was recorded after this run read its evidence (snapshot ${SNAPSHOT_AT}). Leaving the newer verdict in place."
              exit 0
            fi
          fi

          # Only post when Codex has actually reviewed this commit.
          # Skipping the `pending` post entirely eliminates the race where
          # a pull_request run that GETs before Codex submits, then POSTs
          # after the pull_request_review run already posted success,
          # would regress the status. Any GET-then-POST guard still has a
          # TOCTOU window; the cleaner fix is "no pending post."
          #
          # UX: a missing required status check shows as "Waiting for
          # status to be reported" in branch-protection's merge UI, which
          # is exactly the pending semantics we wanted from the explicit
          # pending state. Branch protection treats a missing required
          # check as blocking — equivalent to pending for gating purposes.
          #
          # SAN-314: `state` is now graded rather than hardcoded to
          # success. The residual race this leaves is benign and points the
          # safe way: a slow run that graded an OLD review can only
          # overwrite a newer success with a FAILURE, never the reverse, so
          # the worst case blocks a mergeable PR (visible, cleared by a
          # re-run) instead of releasing an unreviewed one.
          #
          # GitHub truncates status descriptions at 140 characters.
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="codex-review" \
            -f description="${DESCRIPTION}" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=${STATE} on ${HEAD_SHA}: ${DESCRIPTION}"
