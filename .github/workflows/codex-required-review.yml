name: Codex Required Review

# CALLER ONLY (SAN-314). All gate behaviour lives in the reusable workflow at
# .github/workflows/codex-review-gate.yml — add logic THERE, not here.
#
# This file exists because a reusable workflow cannot declare its own
# triggers. Everything below the `uses:` line is the trigger contract, and
# the rationale for each trigger is load-bearing: it records failures that
# were paid for once already. Read it before editing.
#
# PERMISSIONS ARE DECLARED HERE ON PURPOSE. A called workflow can only
# narrow the caller's GITHUB_TOKEN, never widen it, and this repo's default
# workflow permission is `read`. Without this block the gate cannot post a
# commit status at all.

on:
  pull_request_target:
    # DELIBERATELY NOT labeled/unlabeled. An earlier cut of SAN-314 added
    # those so the break-glass label could re-post on its own. It poisoned
    # the anti-stale push-time proxy below: label runs report as
    # `event=pull_request_target`, the runs API exposes `event` but NO
    # action field, so they cannot be filtered back out — a label change
    # between an `@codex` mention and the bot's reply pushed
    # latest_push_time past mention_time and false-blocked a valid
    # comment-shaped review. Codex P2 on eva-chen#30, confirmed in review.
    # The ack re-checks on the next natural run instead; see BREAK GLASS.
    # ready_for_review is REQUIRED, not cosmetic (SAN-318). Codex subscribes
    # a PR to automatic review at OPEN time, so a PR opened as a draft is
    # never subscribed and its required `codex-review` status would never
    # post. The draft-path nudge step in the gate is the other half; without
    # this trigger, marking a draft ready does not re-run the gate and the
    # nudge never gets a chance to fire.
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  # THE codex-fixed ROUTE HAS TO BE ABLE TO RE-RUN THE GATE (SAN-349). The
  # procedure is "RESOLVE the finding's thread FIRST, THEN reply in it with the
  # marker" -- in that order, and the order is load-bearing. Neither act is a
  # `pull_request_review` submission or an `issue_comment`, so before this
  # trigger existed, following the header verbatim left the stale `failure`
  # sitting there until some unrelated push or top-level PR comment happened to
  # re-run the job. The ticket's headline defect is that a correctly-fixed PR
  # has no honest route to green; a route whose last step does not re-grade is
  # not one.
  #
  # WHY THE ORDER, AND NOT A SECOND TRIGGER. A claim needs a marker AND a
  # resolved thread, so whichever act comes second is the one that has to
  # re-grade. Resolving a thread emits `pull_request_review_thread`, and THAT
  # EVENT DOES NOT LOAD ON THESE REPOS: adding it -- bare, `[resolved]`, or
  # `[resolved, unresolved]` -- makes GitHub refuse the WHOLE FILE, the
  # workflow name reverts to its path, and no run of any kind fires. Measured
  # three ways on santos-brand against an unmodified-main control that loads
  # clean (SAN-349, 2026-08-06). `actionlint` and a YAML parse both accept it.
  # DO NOT RE-ADD IT.
  #
  # So the marker comment is made the LAST act. The Codex Fix Claim Event
  # bridge observes created/edited/deleted review comments without privileges;
  # its completion wakes this workflow through workflow_run. The second hop is
  # necessary because fork review-comment runs receive a read-only token.
  #
  # This is chatty -- Codex files each inline finding as its own review comment
  # -- but `cancel-in-progress` is deliberately NOT extended to it. Cancelling
  # can kill the one run that was about to post, and GitHub already keeps at
  # most one PENDING run per concurrency group, so a burst of inline comments
  # collapses to one queued re-grade on its own. Every run recomputes the
  # verdict from durable sources, so the survivor is never worse informed than
  # the runs it replaced. Same doctrine martin adopted when it serialised its
  # writers.
  workflow_run:
    workflows: [Codex Fix Claim Event]
    types: [completed]

permissions:
  contents: read
  # WRITE: a called workflow can only NARROW the caller's token, never widen
  # it, so the gate's `pull-requests: write` is only real if the caller grants
  # it here too. Backs the draft-path nudge's no-token fallback comment.
  pull-requests: write
  statuses: write
  checks: write
  actions: read
  issues: read

jobs:
  gate:
    uses: robblejuwaan/aios/.github/workflows/codex-review-gate.yml@main
    # NAME THE SECRET, NEVER `secrets: inherit` (Codex P1 on sloane#11). The
    # gate is loaded from the mutable `aios@main` ref, so inherit would hand
    # every Actions secret this repo holds to whatever that ref says at run
    # time, re-resolved on every run and invisible in this diff. GITHUB_TOKEN
    # is supplied to a called workflow automatically and is not listed here.
    # CODEX_ACK_MANUAL_SECRET is the gate's only real secret; a repo without
    # it passes the empty string, which the override step already fails
    # closed on. CODEX_REVIEW_REQUEST_TOKEN backs the draft-path nudge and is
    # likewise optional — without it the gate posts a comment naming the
    # string to type instead of requesting the review itself.
    # Copy this whole block verbatim into every caller.
    secrets:
      CODEX_ACK_MANUAL_SECRET: ${{ secrets.CODEX_ACK_MANUAL_SECRET }}
      CODEX_REVIEW_REQUEST_TOKEN: ${{ secrets.CODEX_REVIEW_REQUEST_TOKEN }}
