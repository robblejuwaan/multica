name: Codex Required Review

# Posts a `codex-review` GitHub status check on a PR's head commit so
# branch protection can require Codex to actually review before merge.
#
# Why this exists: chatgpt-codex-connector emits PR reviews but does NOT
# emit GitHub Actions check-runs or commit statuses. Branch protection's
# `required_status_checks.contexts` can only require a status check, not
# a PR review. Without this shim, "require Codex review" can't be
# enforced — see docs/audits/2026-05-04-codex-portfolio-audit.md.
#
# Codex has TWO observed response shapes (AHAD-15, 2026-05-05):
#   A. Formal PR review (auto-triggered on PR open). Fires the
#      pull_request_review event. Detected via the reviews API
#      with commit_id == head SHA.
#   B. Issue-comment reply to an `@codex review` mention. Does NOT
#      fire pull_request_review. Detected via issue_comment event on
#      the PR with author == chatgpt-codex-connector[bot] and a body
#      whose first content line starts with `Codex Review` (matches
#      both `Codex Review: Didn't find any major issues...` and
#      `### 💡 Codex Review` markdown shapes).
#
# Shape B was the bin#7 stall (AHAD-12, 77 min open with required check
# never posted) — Codex had reviewed via comment, but the shim only
# listened for shape A.
#
# Behavior:
#   - On PR open / synchronize / reopened: post `codex-review` as
#     `success` if a Codex formal review already exists for the head
#     SHA; otherwise post nothing (the missing required check is the
#     pending signal — branch protection treats it as blocking).
#   - On Codex submitting a formal review (pull_request_review event):
#     post `codex-review` as `success` for that head commit.
#   - On Codex commenting via @-mention (issue_comment event from
#     chatgpt-codex-connector[bot]): post `codex-review` as `success`
#     for the current head SHA, gated on TWO checks:
#       (1) Prefix guard — body's first content line matches
#           `Codex Review` (rejects refusals + non-review comments).
#       (2) Anti-stale-bypass — HEAD wasn't pushed between the
#           review request and the bot response. Composed of:
#           - Mention selection: the @codex mention this response
#             is for is the OLDEST unanswered one — earliest
#             non-bot @codex comment after the last bot
#             Codex-Review-shape comment (Codex P1 #3, AHAD-15
#             own-PR review). Latest-mention heuristics let an
#             attacker decoy a stale response onto a new SHA.
#           - Push timestamp: from `actions/runs` filtered to
#             `event=pull_request_target`, which is server-side
#             and ungameable. `commit.committer.date` lives on
#             the commit object and `git commit --date=…` would
#             defeat that gate (Codex P1 #2).
#           - Comparison: STRICT `<` so equal-second push/mention
#             pairs (same UTC second) are rejected as
#             unverifiable (Codex P2).
#     Force-push AFTER a successful comment-shape post naturally
#     invalidates the gate because the new HEAD has no status check
#     posted; a fresh `@codex review` nudge re-fires this path.
#
# What "passing" means: Codex has submitted a review for the current head
# SHA **and that review raised no P0/P1**. The gate covers review LATENCY
# (review must happen before merge — the gap PR #84 surfaced) AND review
# SEVERITY (SAN-314).
#
# SEVERITY (SAN-314, 2026-08-06). Until this change the shim posted
# `success` on any Codex response, so at the merge button "codex-review
# passed" and "Codex found nothing serious" were different statements that
# looked identical — and auto-merge landed P1s behind a green check.
# Measured, not theorised: eva-chen PR #25 merged as c1b33b3 with
# codex-review=SUCCESS while Codex had filed 2 P1 + 2 P2 on that head. A
# 14-PR sample taken while writing this found SEVEN more carrying a P1
# under a green check.
#
# WHERE THE SEVERITY LIVES — the part that makes the naive fix wrong.
# Codex puts findings in TWO places, and a gate that reads only one of
# them reproduces the bug:
#   1. Inline review comments (`pulls/{n}/comments`). This is the usual
#      shape — eva-chen #25's 2 P1 were here and the review BODY was pure
#      boilerplate ("Here are some automated review suggestions"). Parsing
#      only the body would have posted green on the very merge that
#      motivated this ticket.
#   2. The review body itself. media-capture-app #43 has zero inline
#      comments and a P1 in the body. Parsing only the comments would
#      have missed that one.
# Both are scanned. Each finding is rendered as a shields.io badge —
# `**<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange…)`— so
# the alt text and the badge URL both carry the level.
#
# BINDING: findings are matched to reviews via `pull_request_review_id`,
# NOT via the comment's own `commit_id`. A review comment's `commit_id`
# tracks the diff as the PR advances, so a fixed-and-re-pushed P1 could
# keep failing forever. Anchoring on the review that raised it means a new
# head SHA starts from a clean slate, exactly like the latency gate does.
#
# FAIL CLOSED ON FORMAT DRIFT: Codex only leaves inline comments when it
# has findings, and every finding carries a P0–P3 badge. So a finding that
# matches NO severity pattern means the format moved under us — that posts
# `failure` with an explicit description rather than silently grading it
# green. This is the one guard that keeps a future Codex re-skin from
# quietly restoring the original bug.
#
# BREAK GLASS: a false-positive P1 must not wedge a PR forever. Apply the
# `codex-p1-ack` label, then comment on the PR to re-check — the comment
# is what re-runs this workflow, because label events are deliberately not
# triggers (see above). EVERY acknowledgement must first leave exactly one
# durable marker in a PR comment (replacing the values):
#
#   <!-- codex-p1-ack: actor=Wren Solano; run=<Multica task UUID> -->
#
# The marker must be no more than ten minutes before the label and be authored
# by the same GitHub principal that applied it. The status names the declared
# actor rather than the shared token owner. Missing, ambiguous, or malformed
# evidence fails closed: it must never turn a claimed agent action into a green
# status attributed to the token owner (SAN-321).
#
# WHAT THAT MARKER PROVES, EXACTLY (SAN-338). Every Santos agent authenticates
# to GitHub as the shared token owner, so GitHub cannot tell one actor here
# from another. The agent marker is therefore a SELF-DECLARATION: it records
# who says they did it, tied to a Multica run so the claim is checkable
# out-of-band against that run's log. It is not proof, and the status says
# `self-declared` so nobody reads it as one.
#
# A ROBB ACKNOWLEDGEMENT IS THE ONE CLAIM THAT MUST BE PROVEN, because it is
# the only one that asserts a human sign-off. Self-declaration is not enough:
# SAN-321 shipped a manual branch matching `actor=Robb; source=manual` with no
# second factor, and an agent used it to publish
# `codex-p1-ack recorded by Robb — no P0/P1` on martin#46 (run 31134005280)
# with no involvement from Robb at all. It also inverted the incentive — the
# unattributable path was the cheaper one. So the manual marker now carries an
# HMAC over the PR it dismisses:
#
#   <!-- codex-p1-ack: actor=Robb; source=manual; nonce=<16 hex>; proof=<64 hex> -->
#
#   proof = HMAC-SHA256(CODEX_ACK_MANUAL_SECRET,
#                       "codex-p1-ack:v1:<owner>/<repo>#<pr>:<nonce>")
#
#   <owner>/<repo> is LOWERCASED on both sides — the workflow reads GitHub's
#   canonical casing and the script reads the local remote's, so normalising is
#   what keeps them agreeing on a repo whose name has a capital in it.
#
# Produce one with `scripts/codex-ack-marker.sh <pr-number>`, which prompts for
# the secret without echoing it and prints the whole marker line to paste.
#
#   - `nonce` is single-use per PR. A proof is public once posted, so without
#     this, one genuine Robb ack would let anyone re-ack that PR forever by
#     copying the comment. A nonce seen in more than one comment fails closed.
#   - The proof deliberately does NOT bind to the head SHA. Binding it there
#     would invalidate a valid acknowledgement on the next unrelated push and
#     the path would be abandoned as unusable.
#   - `actor=Robb` is REJECTED on the run-referenced branch. Otherwise the
#     forgery just moves house: `actor=Robb; run=<any uuid>` would have
#     published the same false human sign-off.
#   - If `CODEX_ACK_MANUAL_SECRET` is unset the manual branch fails closed.
#     HMAC with an empty key is still a stable hash that anyone can compute,
#     so an unconfigured secret must never read as a satisfied one.
#
# SECRET HANDLING. `CODEX_ACK_MANUAL_SECRET` belongs in this repo's Actions
# secrets and in Robb's own password store, and NOWHERE ELSE — specifically not
# in a file, env, or shell history on the box the agents run on, which is where
# they would simply read it.
#
# WHAT THIS DOES NOT CLAIM, AND WHY THE STATUS NO LONGER SAYS "VERIFIED".
# The agents' token carries `repo` + `workflow` scope and admin on this repo, so
# an agent that decides to attack this gate can rewrite it, drop the branch
# protection, or read this very secret out of a workflow it pushes to any
# branch — GitHub hands repository secrets to runs on every branch, not just
# the default one. No control that lives inside GitHub survives that, and this
# one does not pretend to.
#
# So a passing manual acknowledgement establishes POSSESSION OF THE SECRET BY
# SOMEONE WITH WRITE ACCESS HERE. It is not a human signature and the status
# says `with the repo ack secret (possession only, not a signature)` and does
# not name him at all, not even to deny it.
# An earlier cut of this said `by Robb (verified)`, which is the same overclaim
# as the bug SAN-338 exists to fix, moved one step along: a record asserting
# more than it can support. Caught in independent review, 2026-08-06.
#
# What the control actually buys, which is still worth having: it removes the
# CHEAP path. An agent following its instructions has no proof in hand, cannot
# dismiss a finding as Robb, and the expensive route leaves a branch and a run
# behind. Per-agent GitHub identities with reduced scope remain the real fix
# (SAN-321 named it; still deferred), and until then the honest reading of a
# secret-signed ack is "someone who can run a workflow in this repo".
#
# KEEP EVERY `run:` BLOCK UNDER 20 KB. GitHub Actions refuses to load a
# workflow whose single `run:` script is too large, and it refuses the WHOLE
# FILE: the workflow's name reverts to its path and no run of any kind fires,
# so the required check never posts and every PR on the repo wedges. Nothing
# says so on the PR — the only signal is a jobless `failure` run named
# `.github/workflows/codex-required-review.yml` on a push event. Measured on
# martin 2026-08-06: 20,320 bytes loaded, 20,965 bytes did not. actionlint and
# a YAML parse both accept the oversized file; neither checks this. The
# `override` step is the big one and it is ~60% commentary, so PUT NEW PROSE IN
# THIS HEADER rather than in the step. SAN-350 took martin's gate down for
# thirteen minutes by adding comments to it, which is why this is here.
#
# THE MARKER WINDOW, AND WHY EVERY BOUND ON IT IS STRICT. GitHub records every
# Santos agent as the shared token owner, so no label-only acknowledgement is
# attributable. Every actor therefore declares itself in a durable,
# machine-readable PR comment before applying the label, and the `override` step
# accepts that comment only inside a ten-minute window ending strictly before
# the label and starting strictly after the most recent withdrawal.
#
# STRICTLY BEFORE THE LABEL. Timestamps are second-resolution, so a marker and a
# label in the SAME second are unorderable, and an inclusive `<=` resolved that
# TOWARD the merge: apply a bare load-bearing label, post a valid marker inside
# the same second, and the acknowledgement goes green on evidence that did not
# exist when it was made. Re-running the gate to collect that is free on every
# repo carrying this file — `labeled` is a trigger on some of them, and on the
# rest posting the marker comment is itself the trigger. Codex P1, SAN-348 on
# martin and eva-chen#34 here. Cost: an acknowledger who labels within a second
# of posting the marker must post a fresh one, which fails safe.
#
# A MARKER DIES WITH THE LABEL IT AUTHORISED (SAN-338), so the window also
# starts strictly after the most recent withdrawal. Counting nonce re-use across
# comments does not notice a marker being spent TWICE on the SAME comment.
# Without the cutoff: remove the label, wait inside the ten minutes for Codex to
# file a fresh P0/P1, put the label back. The original comment still yields
# nonce_uses == 1 and the public proof still verifies, while the new and later
# ack_time scopes away a finding the acknowledger never saw. Codex P1 on
# martin#50. Re-acknowledging after a withdrawal means a fresh marker, which is
# what running scripts/codex-ack-marker.sh again produces.
#
# A malformed marker inside the window is a claimed but unverifiable agent
# action, so it keeps the gate closed rather than being ignored.
#
# One doctrine under all three: UNVERIFIABLE ORDERING RESOLVES AGAINST THE
# MERGE, never toward it.
#
# ATTRIBUTION IS ONLY PUBLISHED WHERE IT MEANS SOMETHING (SAN-338). A status
# names an acknowledging actor only when the acknowledgement actually dismissed
# a finding. With no P0/P1 on the commit the ack did nothing, so the status
# reports what Codex found and names nobody — the old
# `codex-p1-ack recorded by <actor> — no P0/P1` wording asserted a sign-off that
# was neither needed nor verified, and that is the exact string the martin#46
# forgery published. For the same reason a marker that cannot be validated only
# blocks when the ack is load-bearing: a leftover label on a clean PR is not a
# reason to wedge it.
#
# The ack is TIME-SCOPED, not a permanent downgrade. It dismisses only
# findings from reviews submitted BEFORE THE MARKER WAS SIGNED. A later Codex
# review that raises a NEW P1 blocks again with no further human act.
#
# THE MARKER, NOT THE LABEL, IS THE SCOPE (SAN-338). Scoping to the label
# instead left a first-use gap: an acknowledger signs at T0, a fresh P0/P1
# lands at T1, and anyone applying the label at T2 inside the ten-minute
# window gets T1 dismissed as well — a finding that did not exist when the
# marker was signed, and which the proof therefore says nothing about. Codex
# P1 on martin#50. Scoping to the marker also means the dismissal covers
# exactly what the signer could see. An invalid marker scopes NOTHING, so a
# claim that cannot be validated cannot silence anything either.
# Without this, one label permanently downgraded the gate for that PR:
# Codex files more than one review on a single SHA routinely (eva-chen#25
# has two on 1a581734ec), and the second one's findings were being
# auto-greened. Found in review, SAN-314.
#
# ON THIS REPO THE MANUAL BRANCH IS INERT (SAN-345). No
# `CODEX_ACK_MANUAL_SECRET` is configured here, so the proven-manual branch
# fails closed on every input and the only acknowledgement that can go green
# is an agent's self-declared one. The branch is carried anyway so every gated
# repo runs ONE reviewed shape, and so enabling a Robb acknowledgement later is
# a secret rather than another code change behind another Codex-green PR.
# Whether the manual path survives at all is Robb's open call on SAN-338.
#
# WITHDRAWING the ack restores the block. That is not automatic — an
# earlier cut posted nothing at all on the withdrawal run for a
# comment-path review, leaving the override's stale `success` live on a PR
# with a known P0/P1 (Codex P1 on eva-chen#30, confirmed in review). Two
# things fix it: severity is now recomputed from DURABLE sources on every
# run (see below), and a withdrawal that cannot be re-graded fails closed
# rather than leaving the green in place.
#
# The ack can only ever downgrade a SEVERITY verdict — it never
# substitutes for review, because a status is only posted when Codex has
# actually reviewed this SHA.
#
# DURABLE SOURCES: severity is recomputed on every run from state that
# outlives the triggering event — the reviews on this head SHA, and the
# most recent Codex review-shaped issue comment that does not name a
# different commit. Nothing is read from `github.event.comment` any more.
# That is what makes an `unlabeled` re-check able to restore the failure:
# the evidence is still there to be re-read.
#
# Status check context name is `codex-review` (not `codex` — the latter
# would never fire because Codex doesn't post that name itself).
#
# Why never-post-pending instead of explicit-pending: any GET-then-POST
# guard has a TOCTOU race window where a pull_request run that started
# before Codex reviewed could overwrite a freshly-posted success with
# pending. Posting only on success eliminates the race entirely. The
# UX is identical from the merge-gate perspective — missing required
# check = waiting = blocked.

# Trigger: pull_request_target instead of pull_request. Codex P1 round 6
# caught that pull_request runs the workflow from the PR's branch — a
# contributor could modify this file in their PR to post
# codex-review=success for their own SHA before Codex reviews, bypassing
# the gate this shim is meant to enforce.
#
# pull_request_target runs from the BASE BRANCH (main) instead, so the
# workflow code that owns this status is always the trusted version. This
# job never checks out the PR source (it only calls the GitHub API), so
# the standard pull_request_target risk — running untrusted PR code with
# elevated privileges — does not apply. As a side benefit
# pull_request_target also gives a writable GITHUB_TOKEN on fork PRs,
# which closes the earlier P2 about read-only token on forks.
#
# issue_comment runs from the default branch as well, so the same
# trust-the-base-branch property holds for the comment-shape path.
on:
  pull_request_target:
    # DELIBERATELY NOT labeled/unlabeled. An earlier cut of SAN-314 added
    # those so the break-glass label could re-post on its own. It poisoned
    # the anti-stale push-time proxy below: label runs report as
    # `event=pull_request_target`, the runs API exposes `event` but NO
    # action field, so they cannot be filtered back out — a label change
    # between an `@codex` mention and the bot's reply pushed
    # latest_push_time past mention_time and false-blocked a valid
    # comment-shaped review. Codex P2 on eva-chen#30, confirmed in review.
    # The ack re-checks on the next natural run instead; see BREAK GLASS.
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Deduplicate repeats of the SAME event only. pull_request_target and
# pull_request_review both legitimately run for one SHA — the first looks
# for an existing Codex review, the second fires when a review lands — so
# grouping across events could cancel the run that was about to post the
# status and leave the PR blocked forever.
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  # CANCEL ONLY THE PUSH-DRIVEN PATH. pull_request_target repeats when you push
  # again, and the older run is genuinely superseded. pull_request_review and
  # issue_comment are ONE-SHOT events carrying information no later run
  # reproduces: cancelling them can kill the very run that was about to post
  # `codex-review`, and the replacement (a human comment, author != the Codex
  # bot) will not post it — leaving the required check missing forever on a PR
  # that WAS reviewed. Introduced and caught in review the same day. (Codex P2.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  pull-requests: read
  statuses: write
  checks: write
  # actions: read is required by the comment-shape anti-stale guard so it
  # can query workflow_runs for trustworthy push timestamps. commit dates
  # on the commit object are gameable (Codex P1 #2, AHAD-15 own-PR review).
  actions: read
  # issues: read backs the `codex-p1-ack` break-glass path — the PR
  # timeline is served by the issues API and is where the label's actor
  # comes from, so an override can name who made it (SAN-314).
  issues: read

jobs:
  post-status:
    # issue_comment fires for both issue and PR comments — skip non-PR comments.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PR_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE_EVENT: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Always resolve from the API so the SHA is consistent across
          # event types: review.submitted gives review.commit_id which can
          # lag the actual PR head by a tick during rapid pushes; issue_comment
          # carries no SHA at all (it's tied to the issue/PR, not the commit).
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="$PR_FROM_ISSUE_EVENT"
          else
            pr_number="$PR_FROM_PR_EVENT"
          fi
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.sha')
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr_number} head SHA: ${head_sha}"

      # PASSIVE-PROSE CARVE-OUT (aios-specific, 2026-08-05).
      #
      # Robb named these surfaces as documentation-shaped, not code Codex
      # should evaluate. The previous aios-local workflow expressed that as a
      # `paths-ignore:` on the trigger — which is a TRAP once `codex-review` is
      # a REQUIRED check: a workflow that never runs never reports, and branch
      # protection shows "Waiting for status to be reported" forever. A
      # docs-only PR would have been permanently unmergeable.
      #
      # So the carve-out moves INSIDE the job: the workflow always runs and
      # always reports. A passive-prose-only diff posts success immediately with
      # a description that says why, so the exemption is visible on the PR rather
      # than silent. Operative agent policy (SKILL.md, CLAUDE.md, AGENTS.md,
      # bin/**, .github/**) is deliberately NOT exempt — it is executable
      # instruction, not prose.
      - name: Passive-prose carve-out
        id: docsonly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No files resolved; not treating as docs-only (fail closed)."
            exit 0
          fi
          non_prose=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              decisions/*|references/*|context/*|README.md|LICENSE) ;;
              *) non_prose=1 ;;
            esac
          done <<< "$files"
          if [ "$non_prose" -eq 0 ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "All changed files are passive prose; exempting."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post carve-out status
        if: steps.docsonly.outputs.docs_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="success" \
            -f context="codex-review" \
            -f description="exempt: passive prose only (decisions/references/context/README/LICENSE)" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=success (passive-prose carve-out) on ${HEAD_SHA}"

      # ---------------------------------------------------------------
      # BREAK GLASS (SAN-314). Resolved FIRST because the severity grade
      # below is scoped to when the ack went on.
      # ---------------------------------------------------------------
      - name: Resolve break-glass override
        if: steps.docsonly.outputs.docs_only != 'true'
        id: override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          # Backs the proven-manual branch. Absent on a repo that has not
          # configured it, which fails that branch closed — see the header.
          MANUAL_ACK_SECRET: ${{ secrets.CODEX_ACK_MANUAL_SECRET }}
        run: |
          set -euo pipefail

          has_label=$(
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | index("codex-p1-ack") != null'
          )

          # The PR timeline is the only durable record of WHEN the ack went
          # on and whether it was later withdrawn. Both matter: the first
          # scopes which findings it covers, the second is what makes a
          # withdrawal restore the block instead of silently leaving green.
          timeline=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/timeline" | jq -s '[.[] | .[]]')
          unack_seen=$(printf '%s' "$timeline" | jq -r '[.[] | select(.event == "unlabeled") | select(.label.name == "codex-p1-ack")] | length')
          ack_event=$(printf '%s' "$timeline" | jq -c '[.[] | select(.event == "labeled") | select(.label.name == "codex-p1-ack")] | sort_by(.created_at) | last // empty')
          ack_time=$(printf '%s' "$ack_event" | jq -r '.created_at // ""')
          label_actor=$(printf '%s' "$ack_event" | jq -r '.actor.login // "unknown"')

          # THE MARKER WINDOW: ten minutes, ending strictly BEFORE the label,
          # starting strictly AFTER the most recent withdrawal. Every bound is
          # strict on purpose, and a malformed marker inside it keeps the gate
          # closed rather than being ignored. Rationale and the three Codex P1s
          # behind it are in the header, under THE MARKER WINDOW.
          #
          # One definition of "a marker starts here", shared by the candidate
          # prefilter and the occurrence count below so the two cannot drift.
          MARKER_OPEN='<!--\s*codex-p1-ack\s*:'
          comments='[]'
          if [ -n "$ack_time" ]; then
            marker_window_start=$(date -u -d "${ack_time} - 10 minutes" +%Y-%m-%dT%H:%M:%SZ)
            last_unack_at=$(printf '%s' "$timeline" | jq -r --arg end "$ack_time" '
              [ .[]
                | select(.event == "unlabeled")
                | select(.label.name == "codex-p1-ack")
                | select(.created_at <= $end)
                | .created_at ] | sort | last // ""')
            comments=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')
            # AN EDITED COMMENT IS NOT A MARKER. Editing preserves created_at
            # and only moves updated_at, so every timestamp rule in this step —
            # the ten-minute window, the withdrawal cutoff, and first
            # publication of a nonce — reads the time the comment was FIRST
            # posted, not the time its current text appeared. Without this:
            # post an empty comment now, wait for a real marker to be published,
            # edit the old comment to contain a copy of it, and that copy holds
            # the earlier created_at. That is enough to steal first publication
            # of somebody else's nonce, and with the label applied inside the
            # window, to have their proof validated as your acknowledgement.
            # Found while reviewing this change rather than reported.
            #
            # GitHub sets updated_at == created_at on a comment nobody has
            # edited, so requiring equality rejects the whole class. Cost: a
            # typo fix on a marker comment invalidates it and needs a fresh
            # marker, which fails in the safe direction.
            #
            # A PREFILTER, not the exactness check: it admits a comment carrying
            # AT LEAST one marker opening. Requiring exactly one HERE would drop
            # a two-marker comment out of the candidate set and let the ambiguity
            # go unnoticed instead of failing closed. Exactness is marker_count's
            # job, below.
            marker_candidates=$(printf '%s' "$comments" | jq -c --arg start "$marker_window_start" --arg end "$ack_time" --arg label_actor "$label_actor" --arg unack "$last_unack_at" --arg open "$MARKER_OPEN" '
              [ .[]
                | select(.user.login == $label_actor)
                | select(.created_at == .updated_at)
                | select(.created_at >= $start and .created_at < $end)
                | select($unack == "" or .created_at > $unack)
                | select(.body | test($open))
              ] | sort_by(.created_at)')
            if [ -n "$last_unack_at" ]; then
              echo "codex-p1-ack was withdrawn at ${last_unack_at}; only markers posted after that count for the label at ${ack_time}."
            fi
          else
            marker_candidates='[]'
          fi
          marker=$(printf '%s' "$marker_candidates" | jq -c 'last // empty')
          # OCCURRENCES, NOT COMMENTS. `length` counted candidate COMMENTS, so a
          # comment carrying two markers passed as 1, and the unanchored
          # `capture` below then took whichever matched first: two markers naming
          # different actors published an arbitrary one of them — ambiguous
          # evidence resolving into a confident attribution, which is the class
          # this gate exists to stop. Openings rather than whole markers,
          # deliberately: a malformed second marker has to fail the comment too,
          # and it would not match a well-formed pattern. Codex P1, SAN-350.
          marker_count=$(printf '%s' "$marker_candidates" | jq --arg open "$MARKER_OPEN" '[ .[] | (.body // "") | [ match($open; "g") ] | length ] | add // 0')
          # When the marker was signed. This, not the label event, is what the
          # dismissal is scoped to — see the header.
          marker_at=$(printf '%s' "$marker" | jq -r '.created_at // ""')
          marker_actor=$(printf '%s' "$marker" | jq -r '
            .body // ""
            | try capture("<!--\\s*codex-p1-ack\\s*:\\s*actor=(?<actor>[A-Za-z][A-Za-z .-]{0,70});\\s*run=(?<run>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\\s*-->").actor catch empty')
          marker_run=$(printf '%s' "$marker" | jq -r '
            .body // ""
            | try capture("<!--\\s*codex-p1-ack\\s*:\\s*actor=(?<actor>[A-Za-z][A-Za-z .-]{0,70});\\s*run=(?<run>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\\s*-->").run catch empty')
          # The proven-manual shape. `actor=Robb` is baked into the pattern, so a
          # captured nonce/proof pair IS a well-formed claim to be Robb; whether
          # the claim holds is decided by the HMAC below.
          MANUAL_RE='<!--\s*codex-p1-ack\s*:\s*actor=Robb;\s*source=manual;\s*nonce=(?<nonce>[0-9a-fA-F]{16});\s*proof=(?<proof>[0-9a-fA-F]{64})\s*-->'
          manual_nonce=$(printf '%s' "$marker" | jq -r --arg re "$MANUAL_RE" '.body // "" | try capture($re).nonce catch empty')
          manual_proof=$(printf '%s' "$marker" | jq -r --arg re "$MANUAL_RE" '.body // "" | try capture($re).proof catch empty')
          # Manual-SHAPED but not well-formed — e.g. the unproven SAN-321 shape
          # `actor=Robb; source=manual`. Tracked separately so it fails closed
          # with a message that names the actual problem instead of a generic
          # "malformed marker".
          manual_shaped=$(printf '%s' "$marker" | jq -r 'if ((.body // "") | test("codex-p1-ack\\s*:[^>]*source=manual")) then "true" else "false" end')

          identity_valid=false
          actor="unverified acknowledgement"
          # WHAT THE TWO KINDS ACTUALLY PROVE, which is what the status says.
          #   self-declared — an agent naming itself and its Multica run.
          #     GitHub cannot corroborate any of it.
          #   secret-signed — an HMAC that required CODEX_ACK_MANUAL_SECRET.
          #     NOT a proof of Robb, and the status must not read as one: the
          #     agents' token can push a branch carrying a workflow that prints
          #     a repository secret, so this demonstrates possession of the
          #     secret by someone with write access to this repo. That is a
          #     materially higher bar than a typed name and it leaves a branch
          #     and a run behind, but it is not a human signature. An earlier
          #     cut of this called it `verified` and named Robb in the status,
          #     which is the same overclaim as the bug SAN-338 exists to fix,
          #     one step further along. Independent review, 2026-08-06.
          actor_kind="unverified"
          if [ "$marker_count" -ne 1 ]; then
            echo "FAIL CLOSED: expected exactly one codex-p1-ack marker from ${label_actor} before label at ${ack_time}; found ${marker_count}."
          elif [ -n "$manual_nonce" ] && [ -n "$manual_proof" ]; then
            # A NONCE IS SPENT BY ITS FIRST PUBLICATION. A proof is public the
            # moment it is posted, so the marker being validated has to BE that
            # first publication — anyone can copy the comment, nobody can copy
            # their way to being earlier than it.
            #
            # Why this shape rather than "the nonce appears exactly once":
            #   - Counting only the LABEL PRINCIPAL's markers breaks the moment
            #     more than one principal can label, which is the direction this
            #     repo is meant to move in (per-agent identities). Principal B
            #     copies A's public marker, applies the label itself, sees one
            #     use of the nonce among its own comments, and the HMAC — whose
            #     message names no principal — still verifies and publishes a
            #     sign-off by A. Codex P1 on martin#50.
            #   - Counting ACROSS principals instead turns any copy into a
            #     permanent denial of the break-glass path: post a copy of each
            #     fresh marker as it appears and the count is never 1 again.
            # Earliest-publication has neither failure. It also makes binding the
            # principal into the signed message unnecessary: a replay is by
            # definition not the first publication, so there is nothing for a
            # second principal to gain, and Robb never has to know which account
            # will apply the label.
            #
            # A tie on the earliest timestamp is rejected as unorderable, the
            # same doctrine as every other ordering comparison here. It also
            # cannot occur honestly: a nonce is unguessable until the comment
            # that publishes it exists.
            #
            # (Deleting the first publication to make a copy the earliest is
            # possible with this token, and is out of reach of any in-GitHub
            # control; see the header.)
            # Edited comments are excluded here too, and for the same reason: an
            # edit that back-dates a copy into first place would otherwise
            # disqualify the genuine marker it copied.
            nonce_markers=$(printf '%s' "$comments" | jq -c --arg n "$manual_nonce" --arg re "$MANUAL_RE" '
              [ .[]
                | select(.created_at == .updated_at)
                | select(((.body // "") | try capture($re).nonce catch "") == $n)
                | .created_at
              ] | sort')
            nonce_first_at=$(printf '%s' "$nonce_markers" | jq -r 'first // ""')
            nonce_first_count=$(printf '%s' "$nonce_markers" | jq --arg a "$nonce_first_at" '[.[] | select(. == $a)] | length')
            if [ -z "${MANUAL_ACK_SECRET:-}" ]; then
              echo "FAIL CLOSED: manual codex-p1-ack marker present but CODEX_ACK_MANUAL_SECRET is not configured on this repository."
            elif [ "$marker_at" != "$nonce_first_at" ] || [ "$nonce_first_count" -ne 1 ]; then
              echo "FAIL CLOSED: this nonce was first published at ${nonce_first_at} (x${nonce_first_count}), not by the marker at ${marker_at}; a nonce is spent by its first publication."
            else
              # The expected proof NEVER leaves this subshell. It is derived
              # from a secret rather than being one, so GitHub would not mask
              # it in the log, and printing it hands anyone a valid proof for
              # this PR — the exact forgery this branch exists to stop. So the
              # comparison happens inside python and only `ok`/`no` comes back.
              # The key arrives over a pipe for the same reason as in
              # scripts/codex-ack-marker.sh; nonce and proof are already
              # regex-constrained to hex, so passing them in argv is safe.
              # compare_digest is the constant-time comparison.
              #
              # One line, deliberately: this is a YAML block scalar, so a
              # multi-line python program would have to be indented to stay
              # inside the block, and indented top-level python is a syntax
              # error. Every statement here is simple, so `;` is enough.
              #
              # WHAT THE MESSAGE BINDS, AND WHAT IT DELIBERATELY DOES NOT.
              # Repo, PR and nonce — so a proof is useless on another PR, and
              # useless twice on this one. Not the head SHA: that would void a
              # valid acknowledgement on the next unrelated push and the path
              # would be abandoned as unusable. Not the acknowledgement time:
              # the scope comes from the marker comment's own timestamp, which
              # the signer cannot predict and does not need to. Not the label
              # principal: replay by a second principal is already impossible,
              # because a copy cannot be the first publication of its nonce.
              #
              # CASE-NORMALISED. This side reads GITHUB_REPOSITORY, GitHub's
              # canonical casing; scripts/codex-ack-marker.sh reads the local
              # remote, whatever was typed. A capital in a repo name would mint a
              # proof that cannot verify — safe, but it reads as "the manual path
              # is broken". Owner and repo names are case-insensitively unique on
              # GitHub, so lowercasing is total and needs no network call. `A-Z`
              # not `[:upper:]`: repo names are ASCII, the class form is
              # locale-dependent. Codex P2, SAN-350.
              repo_key=$(printf '%s' "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')
              manual_msg="codex-p1-ack:v1:${repo_key}#${PR_NUMBER}:${manual_nonce}"
              proof_ok=$(
                printf '%s' "$MANUAL_ACK_SECRET" \
                  | python3 -c 'import hashlib,hmac,sys;k=sys.stdin.buffer.read();e=hmac.new(k,sys.argv[1].encode(),hashlib.sha256).hexdigest();print("ok" if hmac.compare_digest(e,sys.argv[2].lower()) else "no")' \
                    "$manual_msg" "$manual_proof"
              )
              if [ "$proof_ok" = "ok" ]; then
                identity_valid=true
                # The DECLARED actor is kept for the run log, not for the
                # status. The marker comment on the PR is where "Robb says he
                # did this" lives durably; a 140-character status that names
                # him is read as a signature, and this cannot establish one.
                actor="Robb"
                actor_kind="secret-signed"
                echo "Acknowledgement signed with the repo ack secret before label at ${ack_time}; marker declares ${actor}. This proves possession of CODEX_ACK_MANUAL_SECRET, not that ${actor} was present."
              else
                echo "FAIL CLOSED: manual codex-p1-ack proof does not verify for ${GITHUB_REPOSITORY}#${PR_NUMBER}."
              fi
            fi
          elif [ "$manual_shaped" = "true" ]; then
            echo "FAIL CLOSED: manual codex-p1-ack marker carries no nonce+proof. A Robb acknowledgement must be proven — see scripts/codex-ack-marker.sh (SAN-338)."
          elif [ -n "$marker_actor" ] && [ -n "$marker_run" ]; then
            # RESERVED NAME. Without this the forgery just moves to the
            # run-referenced branch: `actor=Robb; run=<any uuid>` would publish
            # the same unearned human sign-off (SAN-338).
            #
            # Compared on LETTERS ONLY and ANYWHERE IN THE NAME, because the
            # actor pattern also admits space, dot and hyphen. Two rounds of
            # Codex P1 on martin#50 walked in from both ends of that:
            #   - anchored on `robb` + whitespace or end-of-string, `actor=Robb.`
            #     and `actor=Robb-` went through;
            #   - anchored on a `robb` PREFIX, `actor=Mr Robb` and `actor=R. Robb`
            #     went through as `mrrobb` and `rrobb`.
            # Both publish the same human-looking sign-off with no HMAC behind
            # it. Stripping to letters and testing for `robb` anywhere collapses
            # every variant onto one check.
            #
            # A substring test rather than an allowlist of agent names: an
            # allowlist has to be edited every time the fleet gains an agent,
            # and the failure mode of a stale one is a valid acknowledgement
            # rejected, which is how break-glass paths get abandoned. The cost
            # of the substring is that an agent genuinely named something
            # containing `robb` cannot use this branch, which is a name nobody
            # has and a fail-closed direction anyway.
            actor_norm=$(printf '%s' "$marker_actor" | tr -cd '[:alpha:]' | tr '[:upper:]' '[:lower:]')
            case "$actor_norm" in *robb*) reserved=1 ;; *) reserved=0 ;; esac
            if [ "$reserved" -eq 1 ]; then
              echo "FAIL CLOSED: a run-referenced codex-p1-ack must name the acting agent. Robb cannot be claimed this way — use scripts/codex-ack-marker.sh (SAN-338)."
            else
              identity_valid=true
              actor="$marker_actor"
              actor_kind="self-declared"
              echo "Agent acknowledgement: ${actor}, run ${marker_run}, before label at ${ack_time}."
            fi
          else
            echo "FAIL CLOSED: malformed codex-p1-ack marker before label at ${ack_time}."
          fi

          prior=$(
            gh api --paginate "repos/${{ github.repository }}/commits/${HEAD_SHA}/statuses" \
              | jq -s -r '[.[] | .[] | select(.context == "codex-review")] | sort_by(.created_at) | last | .state // "none"'
          )

          # ack_time is the SCOPE of the dismissal, and it is the marker's
          # timestamp rather than the label's. An unvalidatable marker scopes
          # nothing at all: emitting a scope for a claim that failed validation
          # would silence findings on the strength of the claim this step just
          # rejected. The verdict step turns that empty scope into a failure
          # whenever the ack was load-bearing.
          if [ "$has_label" = "true" ] && [ "$identity_valid" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "ack_time=${marker_at}" >> "$GITHUB_OUTPUT"
            echo "Override active: codex-p1-ack signed by ${actor} at ${marker_at} (label at ${ack_time}); findings from that moment on still block."
          elif [ "$has_label" = "true" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "ack_time=" >> "$GITHUB_OUTPUT"
            echo "Override present but its identity could not be established; scoping nothing."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "ack_time=" >> "$GITHUB_OUTPUT"
          fi
          # CLAMPED because the declared actor is the only unbounded part of a
          # status description, and GitHub truncates those at 140 characters.
          # The marker pattern admits 71 characters of name, which is enough to
          # push the longest verdict wording over the limit — and the first
          # thing cut is the trailing `(self-declared)`, i.e. exactly the part
          # that stops the status reading as a verified sign-off. Real agent
          # names are nowhere near 48.
          echo "actor=${actor:0:48}" >> "$GITHUB_OUTPUT"
          echo "actor_kind=${actor_kind}" >> "$GITHUB_OUTPUT"
          echo "identity_valid=${identity_valid}" >> "$GITHUB_OUTPUT"
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          # Withdrawn = the label has been removed at least once and is not
          # on now. Used to fail closed if severity cannot be re-derived.
          if [ "$has_label" != "true" ] && [ "${unack_seen}" -gt 0 ]; then
            echo "withdrawn=true" >> "$GITHUB_OUTPUT"
            echo "codex-p1-ack has been withdrawn on this PR."
          else
            echo "withdrawn=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      # SEVERITY (SAN-314). "Codex responded" is not "Codex was happy".
      #
      # Every input here is DURABLE — re-readable on any later run. That is
      # deliberate: an earlier cut graded the triggering comment out of
      # `github.event`, so a run fired by anything else could not re-derive
      # the verdict and posted nothing, stranding a stale `success`.
      # ---------------------------------------------------------------
      - name: Grade finding severity
        if: steps.docsonly.outputs.docs_only != 'true'
        id: severity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ACK_TIME: ${{ steps.override.outputs.ack_time }}
          PRIOR: ${{ steps.override.outputs.prior }}
        run: |
          set -euo pipefail

          # Stamped BEFORE any evidence is read, so it is a lower bound on
          # how fresh this run's snapshot is. The post step uses it to
          # refuse to overwrite a failure that was decided after we looked.
          snapshot_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "snapshot_at=${snapshot_at}" >> "$GITHUB_OUTPUT"

          # Codex renders every finding with a shields.io severity badge:
          #   **<sub><sub>![P1 Badge](https://img.shields.io/badge/P1-orange?style=flat)</sub></sub>  Title**
          # Both the alt text and the badge URL carry the level, so either
          # anchor alone is sufficient — matching both is belt and braces
          # against one of the two being restyled. The trailing shapes
          # (`[P1]`, `**P1**`, `P1:`) cover the plainer prose summaries.
          #
          # `[^A-Za-z0-9/]` before the bare-token alternative is what stops
          # the badge URL's own `…/badge/P1-orange` path segment from being
          # double-counted, and stops words like "GP1" matching.
          #
          # One spelling, two engines: jq's --arg passes the pattern through
          # uninterpreted, so this single-backslash form is valid for both
          # jq's test() and grep -E. Verified as a truth table rather than
          # assumed — the doubled-backslash form ALSO appears to work, for
          # the wrong reason, which is exactly the kind of thing that rots.
          #
          # VERIFIED against 14 real PRs across 5 repos before rollout
          # (7 with a P0/P1, 7 without): 14/14 agreement with an
          # independent hand-check, no false pass, no false block, and no
          # finding that failed to classify. Do not loosen these without
          # re-running that comparison — a false PASS here is invisible and
          # restores the exact bug this closes.
          BLOCKING='(P[01][[:space:]]+Badge|badge/P[01]-|\[P[01]\]|\*\*P[01]\*\*|(^|[^A-Za-z0-9/])P[01][[:space:]]*[:.)])'
          CLASSIFIED='(P[0-3][[:space:]]+Badge|badge/P[0-3]-|\[P[0-3]\]|\*\*P[0-3]\*\*|(^|[^A-Za-z0-9/])P[0-3][[:space:]]*[:.)])'
          # Same Codex-Review prefix shapes the comment path already trusts.
          SHAPE='(^|\n)[[:space:]]*(#{1,3}[[:space:]]*(💡[[:space:]]*)?)?Codex Review([[:space:]]|:|$)'

          reviews_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" | jq -s '[.[] | .[]]')
          comments_json=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')
          issue_json=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" | jq -s '[.[] | .[]]')

          read -r graded blocking_total unclassified_total blocking_live unclassified_live < <(
            jq -n -r \
              --argjson reviews "$reviews_json" \
              --argjson comments "$comments_json" \
              --argjson issues "$issue_json" \
              --arg sha "$HEAD_SHA" \
              --arg short "${HEAD_SHA:0:10}" \
              --arg ack "${ACK_TIME:-}" \
              --arg prior "${PRIOR:-none}" \
              --arg blocking "$BLOCKING" \
              --arg classified "$CLASSIFIED" \
              --arg shape "$SHAPE" '
              def bot: "chatgpt-codex-connector[bot]";

              # Formal reviews Codex submitted against THIS head SHA.
              ($reviews | map(select(.user.login == bot and .commit_id == $sha))) as $rv
              | ($rv | map(.id)) as $ids
              | ($rv | map({key: (.id | tostring), value: .submitted_at}) | from_entries) as $ts

              # Findings = top-level inline comments belonging to those
              # reviews. Anchoring on pull_request_review_id (not the
              # comment commit_id) keeps a finding tied to the review that
              # raised it, so a fixed + re-reviewed SHA starts clean.
              # in_reply_to_id == null drops conversational replies, which
              # are not findings and would trip the unclassified guard.
              | ($comments | map(select(
                  .user.login == bot
                  and .in_reply_to_id == null
                  and ((.pull_request_review_id) as $p | $ids | index($p)) != null
                ))) as $fx

              # Comment-path review. Codex usually states
              # "Reviewed commit: <short>", which binds the comment to a
              # SHA outright. Two buckets, because they are NOT equally
              # trustworthy:
              #
              #   $cm_bound   — names THIS head. Self-binding, always safe.
              #   $cm_untagged — names no commit at all. Admissible ONLY as
              #     re-grading evidence for a SHA the gate already accepted
              #     a review for (see $prior below).
              #
              # An earlier cut accepted untagged comments unconditionally.
              # That broke the latency gate outright: after a force-push to
              # an unreviewed SHA B, the old untagged comment still matched,
              # graded=1, and the verdict could post success on a commit
              # Codex had never seen. Codex P1 across 12 of the rollout PRs,
              # and correct — the approval step rejects that case, but its
              # result was not consulted here. Comments naming a DIFFERENT
              # commit fall into neither bucket and are simply ignored.
              | ([ $issues[]
                   | select(.user.login == bot)
                   | select(.body | test($shape))
                   | select(.body | contains($short))
                 ] | sort_by(.created_at) | last) as $cm_bound
              | ([ $issues[]
                   | select(.user.login == bot)
                   | select(.body | test($shape))
                   | select(.body | test("Reviewed commit:") | not)
                 ] | sort_by(.created_at) | last) as $cm_untagged
              | (if $cm_bound != null then $cm_bound
                 elif $prior != "none" then $cm_untagged
                 else null end) as $cm

              # One flat finding list: {ts, body, inline}. Review bodies and
              # the comment body count as one finding each; inline comments
              # count individually and inherit the timestamp of the review
              # that raised them. No apostrophes below this line: the jq
              # program is bash single-quoted, so one would end it early.
              | ( [ $rv[]  | {ts: .submitted_at, body: (.body // ""), inline: false} ]
                + [ $fx[]  | {ts: ($ts[(.pull_request_review_id | tostring)] // ""), body: (.body // ""), inline: true} ]
                + (if $cm == null then [] else [ {ts: $cm.created_at, body: ($cm.body // ""), inline: false} ] end)
                ) as $all

              # Live = not covered by the ack. An ack dismisses only what
              # existed when it was applied, so a later review still blocks.
              #
              # >= not >, deliberately. GitHub truncates timestamps to whole
              # seconds, so a review landing in the SAME second as the label
              # is unorderable — and under > it was silently treated as
              # acknowledged, letting a brand new P0/P1 post success. Equal
              # time therefore stays LIVE. Same doctrine as the strict < on
              # the push/mention comparison above: unverifiable ordering
              # resolves against the merge, never toward it. Codex P1.
              | ( $all | map(select($ack == "" or .ts >= $ack)) ) as $live

              | [ (if (($rv | length) > 0 or $cm != null) then 1 else 0 end),
                  ( [ $all[]  | select(.body | test($blocking)) ] | length ),
                  ( [ $all[]  | select(.inline) | select(.body | test($classified) | not) ] | length ),
                  ( [ $live[] | select(.body | test($blocking)) ] | length ),
                  ( [ $live[] | select(.inline) | select(.body | test($classified) | not) ] | length ) ]
              | @tsv
            '
          )

          echo "graded=${graded}" >> "$GITHUB_OUTPUT"
          echo "blocking_total=${blocking_total}" >> "$GITHUB_OUTPUT"
          echo "unclassified_total=${unclassified_total}" >> "$GITHUB_OUTPUT"
          echo "blocking=${blocking_live}" >> "$GITHUB_OUTPUT"
          echo "unclassified=${unclassified_live}" >> "$GITHUB_OUTPUT"
          echo "Severity on ${HEAD_SHA}: graded=${graded} blocking=${blocking_live}/${blocking_total} unclassified=${unclassified_live}/${unclassified_total} ack=${ACK_TIME:-none}"

      # ---------------------------------------------------------------
      # Final verdict:
      #   success  — Codex reviewed, no live P0/P1 (or all of them acked)
      #   failure  — Codex reviewed and filed a live P0/P1  <-- SAN-314
      #   failure  — an ack was withdrawn and cannot be re-graded
      #   no post  — Codex has not reviewed this SHA (blocking, as before)
      # ---------------------------------------------------------------
      - name: Decide status to post
        if: steps.docsonly.outputs.docs_only != 'true'
        id: verdict
        env:
          GRADED: ${{ steps.severity.outputs.graded }}
          BLOCKING: ${{ steps.severity.outputs.blocking }}
          BLOCKING_TOTAL: ${{ steps.severity.outputs.blocking_total }}
          UNCLASSIFIED: ${{ steps.severity.outputs.unclassified }}
          UNCLASSIFIED_TOTAL: ${{ steps.severity.outputs.unclassified_total }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          OVERRIDE_ACTOR: ${{ steps.override.outputs.actor }}
          OVERRIDE_ACTOR_KIND: ${{ steps.override.outputs.actor_kind }}
          OVERRIDE_IDENTITY_VALID: ${{ steps.override.outputs.identity_valid }}
          WITHDRAWN: ${{ steps.override.outputs.withdrawn }}
          PRIOR: ${{ steps.override.outputs.prior }}
        run: |
          set -euo pipefail

          if [ "${GRADED:-0}" != "1" ]; then
            # Nothing durable to grade. Normally that means Codex has not
            # reviewed this SHA: post nothing, because a missing required
            # check already blocks and posting `pending` reopens the TOCTOU
            # race documented below.
            #
            # The exception is a WITHDRAWN ack sitting on top of a live
            # `success`. Leaving that alone is how a dismissal silently
            # failed to withdraw, so it fails closed instead.
            if [ "${WITHDRAWN:-false}" = "true" ] && [ "${PRIOR:-none}" = "success" ]; then
              echo "post=true" >> "$GITHUB_OUTPUT"
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=codex-p1-ack withdrawn and severity could not be re-derived — re-review needed" >> "$GITHUB_OUTPUT"
              echo "FAILURE: ack withdrawn, nothing durable to re-grade; failing closed rather than leaving the green."
            else
              echo "post=false" >> "$GITHUB_OUTPUT"
              echo "Codex has not reviewed this SHA; posting nothing."
            fi
            exit 0
          fi

          echo "post=true" >> "$GITHUB_OUTPUT"

          # ORDER MATTERS, AND THE ACK CLAUSES ARE SCOPED TO A LOAD-BEARING
          # ACKNOWLEDGEMENT (SAN-338). An ack is load-bearing when there is a
          # finding for it to dismiss. Two things follow, and both were wrong
          # before:
          #   - An unvalidatable marker blocks only when the ack is doing work.
          #     A leftover label on a clean PR used to wedge it outright.
          #   - No actor is named on a status the ack did not change. The old
          #     `codex-p1-ack recorded by <actor> — no P0/P1` line published a
          #     human sign-off that was neither needed nor proven, and it is the
          #     exact string the martin#46 forgery produced.
          #
          # LOAD-BEARING COUNTS BOTH KINDS OF FINDING, and `BLOCKING_TOTAL`
          # alone is not that test. An unreadable finding matches no severity
          # pattern, so it never reaches BLOCKING_TOTAL, while an ack applied
          # after it does silence it out of UNCLASSIFIED. Scoping identity to
          # BLOCKING_TOTAL therefore let a missing or malformed marker suppress
          # a format-drift finding unchallenged — the one guard whose whole job
          # is to fail closed when Codex's format moves. Codex P1 on martin#50.
          ack_load_bearing=0
          if [ "${BLOCKING_TOTAL:-0}" -gt 0 ] || [ "${UNCLASSIFIED_TOTAL:-0}" -gt 0 ]; then
            ack_load_bearing=1
          fi

          # THE STATUS CLAIMS ONLY WHAT THE EVIDENCE CARRIES. A self-declared
          # ack names its actor, because a name is exactly what it asserts. A
          # secret-signed one names NOBODY AT ALL, not even to deny it, and
          # names the evidence instead. Carrying "not proof of Robb" still kept
          # a human identity on an acknowledgement that establishes only that
          # the secret was held, and a reader skims the name and not the
          # negation. Codex P2 on martin#56. The reason it matters: the
          # secret is readable by anything that can push a workflow to this
          # repo, so putting Robb in a 140-character status would be read as
          # his signature over something that only shows the secret was held.
          # Who the marker DECLARES is in the marker comment and the run log,
          # where it can be read with its qualifications attached.
          case "${OVERRIDE_ACTOR_KIND:-unverified}" in
            secret-signed) attribution="with the repo ack secret (possession only, not a signature)" ;;
            *)             attribution="by ${OVERRIDE_ACTOR} (${OVERRIDE_ACTOR_KIND})" ;;
          esac

          # IDENTITY IS CHECKED FIRST, and only because an unvalidatable marker
          # now scopes nothing: every pre-existing finding stays live, so the
          # BLOCKING clause below would catch this case anyway and report it as a
          # plain P0/P1. Both block. Leading with the identity message is the one
          # that tells the reader what to actually do about it.
          if [ "${OVERRIDE:-false}" = "true" ] && [ "$ack_load_bearing" -eq 1 ] && [ "${OVERRIDE_IDENTITY_VALID:-false}" != "true" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=codex-p1-ack identity not established — re-acknowledge with a valid PR marker" >> "$GITHUB_OUTPUT"
            echo "FAILURE: acknowledgement identity cannot be established; failing closed."
          elif [ "${BLOCKING:-0}" -gt 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=Codex filed ${BLOCKING} P0/P1 on this commit — fix, or label codex-p1-ack" >> "$GITHUB_OUTPUT"
            echo "FAILURE: ${BLOCKING} live blocking finding(s)."
          elif [ "${UNCLASSIFIED:-0}" -gt 0 ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "description=${UNCLASSIFIED} Codex finding(s) of unreadable severity — needs a human look" >> "$GITHUB_OUTPUT"
            echo "FAILURE: ${UNCLASSIFIED} unclassified finding(s); failing closed on format drift."
          elif [ "${OVERRIDE:-false}" = "true" ] && [ "${BLOCKING_TOTAL:-0}" -gt 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=${BLOCKING_TOTAL} P0/P1 dismissed via codex-p1-ack ${attribution}" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: ${BLOCKING_TOTAL} P0/P1 and ${UNCLASSIFIED_TOTAL:-0} unreadable finding(s) dismissed ${attribution}; declared actor ${OVERRIDE_ACTOR}; none raised since."
          elif [ "${OVERRIDE:-false}" = "true" ] && [ "${UNCLASSIFIED_TOTAL:-0}" -gt 0 ]; then
            # Reached only when the ack covers unreadable findings and no P0/P1.
            # Kept separate rather than folded into the line above so neither
            # description risks GitHub's 140-character truncation.
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=${UNCLASSIFIED_TOTAL} unreadable finding(s) dismissed via codex-p1-ack ${attribution}" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: ${UNCLASSIFIED_TOTAL} unreadable finding(s) dismissed ${attribution}; declared actor ${OVERRIDE_ACTOR}; none raised since."
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Codex reviewed this commit — no P0/P1" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: reviewed, no blocking findings."
          fi


      - name: Post commit status (graded verdict — never post pending)
        if: steps.verdict.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          SNAPSHOT_AT: ${{ steps.severity.outputs.snapshot_at }}
        run: |
          set -euo pipefail

          # LAST-WRITER GUARD. Event types are separate concurrency groups
          # (the group key includes github.event_name), so a slow
          # pull_request_target run can still be in flight when a
          # pull_request_review run posts `failure` for a review that
          # landed after we read our evidence. Without this, the slow run
          # posts its stale `success` last and the P0/P1 goes green.
          #
          # This is not hypothetical: it is exactly how eva-chen#30 merged
          # with a live P1 — the base copy of this workflow posted success
          # over the head copy's failure at 05:04:51 and auto-merge fired
          # three seconds later. Codex P1 across the rollout PRs.
          #
          # Only `success` is held back. A `failure` may always overwrite,
          # because erring toward blocking is the safe direction, and a
          # missing/incorrect block is visible where a false green is not.
          if [ "${STATE}" = "success" ]; then
            newer_failure=$(
              gh api --paginate "repos/${{ github.repository }}/commits/${HEAD_SHA}/statuses" \
                | jq -s -r --arg t "${SNAPSHOT_AT:-}" '
                    [ .[] | .[]
                      | select(.context == "codex-review")
                      | select(.state == "failure")
                      | select($t == "" or .created_at > $t) ] | length'
            )
            if [ "${newer_failure}" -gt 0 ]; then
              echo "Refusing to post success on ${HEAD_SHA}: a codex-review failure was recorded after this run read its evidence (snapshot ${SNAPSHOT_AT}). Leaving the newer verdict in place."
              exit 0
            fi
          fi

          # Only post when Codex has actually reviewed this commit.
          # Skipping the `pending` post entirely eliminates the race where
          # a pull_request run that GETs before Codex submits, then POSTs
          # after the pull_request_review run already posted success,
          # would regress the status. Any GET-then-POST guard still has a
          # TOCTOU window; the cleaner fix is "no pending post."
          #
          # UX: a missing required status check shows as "Waiting for
          # status to be reported" in branch-protection's merge UI, which
          # is exactly the pending semantics we wanted from the explicit
          # pending state. Branch protection treats a missing required
          # check as blocking — equivalent to pending for gating purposes.
          #
          # SAN-314: `state` is now graded rather than hardcoded to
          # success. The residual race this leaves is benign and points the
          # safe way: a slow run that graded an OLD review can only
          # overwrite a newer success with a FAILURE, never the reverse, so
          # the worst case blocks a mergeable PR (visible, cleared by a
          # re-run) instead of releasing an unreviewed one.
          #
          # GitHub truncates status descriptions at 140 characters.
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="codex-review" \
            -f description="${DESCRIPTION}" \
            -f target_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}/files"
          echo "Posted codex-review=${STATE} on ${HEAD_SHA}: ${DESCRIPTION}"
